                        - generic [ref=e4480]:
                          - generic [ref=e5127]: 🌸【地藏十輪經系列 · 第 1 篇 / 全 100 篇】
                          - generic [ref=e5130]: 佛陀在一座神祕的山上說法, 忽然天空變色了……
                          - generic [ref=e5135]: 親愛的朋友, 早安 🙏
                          - generic [ref=e5140]: 今天開始, 我們要一起讀一部 2500 年前的真實故事。
                          - generic [ref=e5143]: 這個故事被佛陀的弟子記下來, 變成一本經書,
                          - generic [ref=e5146]: 叫做《大乘大集地藏十輪經》。
                          - generic [ref=e5151]: 這本經很厚 — 有 10 卷 8 個品, 比《地藏菩薩本願經》厚 4-5 倍,
                          - generic [ref=e5154]: 故事一個接一個, 非常精彩。
                          - generic [ref=e5157]: 我們會用接下來的 5 個月慢慢說完, 一天一篇。
                          - generic [ref=e5162]: 今天是 第 1 篇 — 神祕的山。
                          - generic [ref=e5167]: ───────────
                          - generic [ref=e5170]: "📖 經文原文:"
                          - generic [ref=e5173]: 「如是我聞:一時, 薄伽梵在佉羅帝耶山, 諸牟尼仙所依住處。」
                          - generic [ref=e5178]: ✨ 「如是我聞」=「我親耳聽到佛陀這樣說的喔!」
                          - generic [ref=e5181]: → 這是阿難尊者說的開場白, 像看影片前的「我親眼看到」一樣。
                          - generic [ref=e5186]: ✨ 「薄伽梵」= 佛陀的尊稱
                          - generic [ref=e5189]: → 意思是「最值得尊敬的覺悟者」。
                          - generic [ref=e5194]: ✨ 「佉羅帝耶山」(讀作 ㄑㄩ ㄌㄨㄛˊ ㄉㄧˋ ㄧㄝˊ)
                          - generic [ref=e5197]: = 一座很特別的山
                          - generic [ref=e5200]: → 山上住著很多修行人(牟尼仙), 像「修行人的村莊」🏔️
                          - generic [ref=e5203]: → 佛陀今天就在這座山上要開示一部新經。
                          - generic [ref=e5208]: ───────────
                          - generic [ref=e5211]: 那是一個清晨。
                          - generic [ref=e5214]: 印度有一座叫做「佉羅帝耶山」的山, 翻成中文有「寂靜光明」的意思。
                          - generic [ref=e5219]: 為什麼叫這個名字? 因為這座山從來不被打擾 ——
                          - generic [ref=e5222]: 🍃 鳥的聲音清脆
                          - generic [ref=e5225]: 🌬️ 風從松林裡穿過時, 像在念經
                          - generic [ref=e5228]: ☁️ 雲飄得很低, 低到可以伸手摸到
                          - generic [ref=e5233]: 山上住著好多好多修行人。
                          - generic [ref=e5236]: 有的在山洞裡打坐, 一坐就是七天七夜不動;
                          - generic [ref=e5239]: 有的在松樹下念經, 念到月亮從東邊升到西邊;
                          - generic [ref=e5242]: 有的拿著缽, 走進山下村莊化緣, 然後再走回山上獨自吃飯。
                          - generic [ref=e5247]: 如果你站在山下抬頭看, 會以為自己看到了「修行人的村莊」。
                          - generic [ref=e5252]: ───────────
                          - generic [ref=e5255]: 那一天, 佛陀坐在山頂的大石頭上。
                          - generic [ref=e5258]: 身邊圍著祂的弟子們。
                          - generic [ref=e5263]: 阿難尊者離佛陀最近 — 他是佛陀的堂弟,
                          - generic [ref=e5266]: 也是最會記憶的弟子。
                          - generic [ref=e5269]: 後來這部經能流傳下來, 全靠他記住了佛陀說的每一個字。
                          - generic [ref=e5274]: 還有一大群「苾芻」(光著頭、穿橙色袈裟的出家人),
                          - generic [ref=e5277]: 一大群「菩薩」(發願幫助大家的修行者),
                          - generic [ref=e5280]: 還有從天上下來的天神、海裡來的龍王、空中的護法神……
                          - generic [ref=e5285]: 整座山被擠得滿滿, 但每個人都安安靜靜, 等著佛陀說話。
                          - generic [ref=e5290]: ───────────
                          - generic [ref=e5293]: 剛剛, 佛陀說完了一部叫《月藏經》的經。
                          - generic [ref=e5296]: "弟子們聽完, 心裡都很滿足, 互相小聲說:"
                          - generic [ref=e5301]: 「今天的法會應該結束了吧?」
                          - generic [ref=e5304]: 「等一下要回茅蓬休息嗎?」
                          - generic [ref=e5307]: 「下山小心啊, 聽說最近山下出現一頭老虎。」
                          - generic [ref=e5312]: 但…… 佛陀沒有起身。
                          - generic [ref=e5317]: 祂只是慢慢地, 看向南方的天空。
                          - generic [ref=e5322]: 阿難尊者抬頭看著天, 手停在念珠上, 動也不動。
                          - generic [ref=e5325]: "他心裡有一個強烈的預感:"
                          - generic [ref=e5328]: 「肯定有一位非常重要的人物 — 要來了。」
                          - generic [ref=e5333]: 那一刻, 山上所有人都不敢呼吸。
                          - generic [ref=e5338]: 明天 — 我們會看到南方天空, 出現了什麼景象。
                          - generic [ref=e5343]: ───────────
                          - generic [ref=e5346]: 💡 啟發反思 (聖嚴法師風格)
                          - generic [ref=e5351]: 聖嚴法師說:「好的事情, 都是慢慢來的。」
                          - generic [ref=e5356]: 想想看, 佛陀為什麼不一開始就直接介紹地藏菩薩?
                          - generic [ref=e5359]: 而是先讓大家等待、靜下心、感受異象?
                          - generic [ref=e5364]: 因為 — 重要的事, 值得我們鄭重對待。
                          - generic [ref=e5369]: "今天看完這篇後, 試試看: 不要急著滑下一個影片。"
                          - generic [ref=e5372]: 給自己一分鐘, 深呼吸三次。
                          - generic [ref=e5377]: 那三次呼吸, 就是您今天的「佉羅帝耶山」🌱
                          - generic [ref=e5382]: ───────────
                          - generic [ref=e5385]: 💡 明日預告
                          - generic [ref=e5390]: "第 2 篇 — 「香雨花雨從南方來」:"
                          - generic [ref=e5393]: 從南方天空, 飄來一團淡金色的雲, 然後下起香雨、花雨、寶物雨、衣服雨。
                          - generic [ref=e5396]: 而從南方天空, 緩緩走來了一位戴寶冠的菩薩……
                          - generic [ref=e5401]: ───────────
