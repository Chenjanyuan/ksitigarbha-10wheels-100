                      - generic [ref=e2320]:
                        - generic [ref=e3330]: 🌸【地藏十輪經系列 · 第 4 篇 / 全 100 篇】
                        - generic [ref=e3333]: 所有人都被搞糊塗了,一位天神舉手代表大家發問......
                        - generic [ref=e3338]: 親愛的朋友,早安 🙏
                        - generic [ref=e3343]: 連續 3 天,我們看到了好多奇蹟 — 香雨花雨、如意珠、光明。
                        - generic [ref=e3346]: 大家心裡的疑問越來越深 ——「這到底是怎麼回事?」
                        - generic [ref=e3351]: 今天 — 一位天神,站出來代表所有人發問。
                        - generic [ref=e3356]: ───────────
                        - generic [ref=e3359]: "📖 經文原文:"
                        - generic [ref=e3364]: 「於眾會中,有天帝釋名無垢生,去薄伽梵不遠而坐,即從座起,頂禮世尊合掌向佛,以頌問曰......」
                        - generic [ref=e3369]: ✨ 「天帝釋」(ㄊㄧㄢ ㄉㄧˋ ㄕˋ) = 天神中的領袖,像我們民間說的「玉皇大帝」
                        - generic [ref=e3372]: ✨ 「無垢生」(ㄨˊ ㄍㄡˋ ㄕㄥ) = 這位天帝釋的名字,意思是「沒有污垢、清淨而生」
                        - generic [ref=e3375]: ✨ 「以頌問」= 用詩歌的方式發問
                        - generic [ref=e3380]: ───────────
                        - generic [ref=e3383]: 在大眾中,有一位天神,名字叫「無垢生」。
                        - generic [ref=e3386]: 他是天界最重要的領袖 — 在我們民間的傳說裡,就像「玉皇大帝」一樣。
                        - generic [ref=e3391]: "他坐在佛陀不遠的位置上,一直在看,一直在想:"
                        - generic [ref=e3394]: 「香雨、花雨、寶飾雨、衣服雨 — 為什麼?」
                        - generic [ref=e3397]: 「如意珠、光明 — 為什麼?」
                        - generic [ref=e3400]: 「全場大眾身體變重 — 為什麼?」
                        - generic [ref=e3405]: "最後他下定決心:"
                        - generic [ref=e3408]: 「我來代表大家問佛陀!」
                        - generic [ref=e3413]: ───────────
                        - generic [ref=e3416]: 他從座位上站起來,慢慢走到佛陀面前。
                        - generic [ref=e3421]: 雙手合掌,表示恭敬。
                        - generic [ref=e3424]: 慢慢地,他低下頭,用額頭碰到佛陀的腳 — 這是印度最尊敬的禮節,叫「頂禮」。
                        - generic [ref=e3429]: "然後他抬起頭,用美麗的詩歌,一句一句地問佛陀:"
                        - generic [ref=e3434]: ───────────
                        - generic [ref=e3437]: 「具諦語、諦見、諦善住的牟尼尊者啊,
                        - generic [ref=e3440]: 您為了眾生宣說究竟堅固的法,
                        - generic [ref=e3443]: 讓所有的生命滅除痛苦的根源。
                        - generic [ref=e3448]: 但 — 為什麼這個時候,
                        - generic [ref=e3451]: 要出現雲雨、寶物、光明這些徵兆?
                        - generic [ref=e3456]: 讓所有大眾歡喜得不得了,心裡升起信心,
                        - generic [ref=e3459]: 都想走向大乘的路,跨越懷疑,看見真理。」
                        - generic [ref=e3464]: ───────────
                        - generic [ref=e3467]: "無垢生繼續問:"
                        - generic [ref=e3472]: 「天人大眾的身體,變得堅實沉重,
                        - generic [ref=e3475]: 連自己都舉不起來 — 這代表什麼?
                        - generic [ref=e3480]: 兩手掌中,都出現了如意珠,
                        - generic [ref=e3483]: 珠子裡下著寶物,還放出光明,
                        - generic [ref=e3486]: 光明照到十方,除去眾生的罪苦,
                        - generic [ref=e3489]: 讓痛苦止息,得到安樂 —
                        - generic [ref=e3492]: 大導師啊,這是為什麼?」
                        - generic [ref=e3497]: ───────────
                        - generic [ref=e3500]: 「是您要讓大家看見,還是有什麼預兆?
                        - generic [ref=e3503]: 各個眾生身上,都掛著香花和飾物,
                        - generic [ref=e3506]: 連我們天神也是覺得疑惑,想不通到底是為什麼。
                        - generic [ref=e3511]: 是有誰將要來嗎?
                        - generic [ref=e3514]: 所以才現出這些神通的力量?
                        - generic [ref=e3517]: 是佛?是菩薩?還是梵天、魔王、帝釋天?
                        - generic [ref=e3522]: 唯願大導師,趕快為大眾宣說!」
                        - generic [ref=e3527]: ───────────
                        - generic [ref=e3530]: 無垢生說完,深深一拜,退回座位。
                        - generic [ref=e3535]: 整個山頂安靜下來。
                        - generic [ref=e3538]: 連風都停了,連葉子都不敢動。
                        - generic [ref=e3543]: 所有人 — 苾芻、菩薩、天人、龍王、印度俗人 — 全部望著佛陀,等他開口。
                        - generic [ref=e3548]: 佛陀微微一笑,慢慢看向眾人。
                        - generic [ref=e3551]: 他知道,這時候 — 是時候揭曉了。
                        - generic [ref=e3556]: ───────────
                        - generic [ref=e3559]: 明天 — 佛陀會親自說出,那位即將到來的大菩薩,是誰......
                        - generic [ref=e3564]: ───────────
                        - generic [ref=e3567]: 💡 啟發反思
                        - generic [ref=e3572]: 聖嚴法師說:「不懂就問,不是丟臉;不問才丟臉。」
                        - generic [ref=e3577]: 無垢生天帝釋是天神中的領袖,卻仍然謙虛地請教佛陀。
                        - generic [ref=e3580]: 他不怕被笑「連天神都不懂」,因為他知道 — 不懂就要問,才有機會明白。
                        - generic [ref=e3585]: 今天,如果心裡有疑問,不要憋著 —
                        - generic [ref=e3588]: 找懂的人問,或在心裡默問佛菩薩。
                        - generic [ref=e3593]: 答案,常常會在你誠心問了之後出現。
                        - generic [ref=e3598]: ───────────
                        - generic [ref=e3601]: 💡 明日預告
                        - generic [ref=e3606]: "第 5 篇 — 「佛揭曉地藏將至」:"
                        - generic [ref=e3609]: 佛陀對無垢生說:「你們都要知道,有一位菩薩,名字叫地藏,他在無量大劫前就成熟有情......」
                        - generic [ref=e3614]: ───────────
                        - generic [ref=e3617]: 📚 免費索取《地藏菩薩本願經》紙本經書
                        - generic [ref=e3622]: 《地藏菩薩本願經》是地藏法門的基礎,淺而易懂,適合初次接觸的朋友。
