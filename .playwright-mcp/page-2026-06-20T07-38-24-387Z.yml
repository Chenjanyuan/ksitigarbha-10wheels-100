                          - generic [ref=e3824]:
                            - generic [ref=e6543]: 🌸【地藏十輪經系列 · 第 6 篇 / 全 100 篇】
                            - generic [ref=e6548]: 佛陀開始讚嘆地藏菩薩 — 就像翻開一本超厚的功德簿......
                            - generic [ref=e6553]: 親愛的朋友, 早安 🙏
                            - generic [ref=e6558]: 昨天 — 佛陀說出了「地藏」這個名字, 大家恍然大悟。
                            - generic [ref=e6561]: 今天 — 佛陀開始用一連串的比喻, 一個接一個地讚嘆這位菩薩。
                            - generic [ref=e6566]: ───────────
                            - generic [ref=e6571]: "📖 經文原文:"
                            - generic [ref=e6576]: 「是地藏菩薩摩訶薩, 有無量無數不可思議殊勝功德之所莊嚴, 一切世間聲聞、獨覺所不能測。此大菩薩, 是諸微妙功德伏藏, 是諸解脫珍寶出處, 是諸菩薩明淨眼目, 是趣涅槃商人導首; 如如意珠, 雨眾財寶, 隨所希求皆令滿足......」
                            - generic [ref=e6581]: ✨ 「莊嚴」= 用美好的東西裝飾
                            - generic [ref=e6584]: ✨ 「不可思議」= 想都想不到的多
                            - generic [ref=e6587]: ✨ 「伏藏」(ㄈㄨˊ ㄗㄤˋ) = 埋在地底下的寶藏
                            - generic [ref=e6590]: ✨ 「商人導首」= 帶領商隊的領隊
                            - generic [ref=e6593]: ✨ 「涅槃」(ㄋㄧㄝˋ ㄆㄢˊ) = 完全的平靜安樂
                            - generic [ref=e6598]: ───────────
                            - generic [ref=e6603]: "佛陀說:"
                            - generic [ref=e6606]: 「這位地藏菩薩 — 他的功德, 多到沒辦法說、想不到、算不完。
                            - generic [ref=e6609]: 連世間的阿羅漢、辟支佛, 都測不出他到底有多深。」
                            - generic [ref=e6614]: 全場聽呆了 — 連阿羅漢都測不出?
                            - generic [ref=e6619]: ───────────
                            - generic [ref=e6624]: 佛陀開始打比方 ——
                            - generic [ref=e6629]: "💎 第 1 個比喻: 「是諸微妙功德伏藏」"
                            - generic [ref=e6632]: 地藏菩薩, 就像一個藏在地底下的大寶藏 —
                            - generic [ref=e6635]: 裡面裝滿了所有最珍貴、最美好的功德。
                            - generic [ref=e6638]: 你需要什麼, 挖開就有。
                            - generic [ref=e6643]: "💎 第 2 個比喻: 「是諸解脫珍寶出處」"
                            - generic [ref=e6646]: 他, 就像珍寶的源頭 —
                            - generic [ref=e6649]: 想要解脫煩惱? 從他這裡, 一個一個拿。
                            - generic [ref=e6652]: 想要快樂? 從他這裡, 一個一個取。
                            - generic [ref=e6657]: "💎 第 3 個比喻: 「是諸菩薩明淨眼目」"
                            - generic [ref=e6660]: 他, 是所有菩薩的「眼睛」 —
                            - generic [ref=e6663]: 其他菩薩走錯了, 看他怎麼走, 就會回到正路。
                            - generic [ref=e6666]: 他的眼睛, 明亮清淨, 看得清一切。
                            - generic [ref=e6671]: "💎 第 4 個比喻: 「是趣涅槃商人導首」"
                            - generic [ref=e6674]: 他, 是帶隊去涅槃的領隊 —
                            - generic [ref=e6677]: 我們這些眾生, 就像一支迷路的商隊。
                            - generic [ref=e6680]: 地藏菩薩走在最前面, 一邊回頭看, 一邊喊:「跟上, 這邊走!」
                            - generic [ref=e6685]: ───────────
                            - generic [ref=e6690]: "💎 第 5 個比喻: 「如如意珠, 雨眾財寶, 隨所希求皆令滿足」"
                            - generic [ref=e6693]: 他, 就像一顆活的如意珠 —
                            - generic [ref=e6696]: 你心裡想什麼, 他就下什麼下來。
                            - generic [ref=e6699]: 想要平安? 平安降下。想要智慧? 智慧降下。
                            - generic [ref=e6702]: 想要病好? 病好降下。
                            - generic [ref=e6707]: 佛陀越說, 大眾越激動 —
                            - generic [ref=e6710]: 「原來世界上有這樣的菩薩! 我一定要好好認識他!」
                            - generic [ref=e6715]: ───────────
                            - generic [ref=e6720]: 明天 — 佛陀會繼續打比方, 把地藏菩薩比作太陽、月亮、火炬、車子......
                            - generic [ref=e6725]: ───────────
                            - generic [ref=e6730]: 💡 啟發反思
                            - generic [ref=e6735]: "聖嚴法師說: 「真正的寶藏, 不是金銀珠寶, 是一顆願意給別人的心。」"
                            - generic [ref=e6740]: 地藏菩薩的「伏藏」, 不是埋在山裡的金子, 是埋在他心裡的願力。
                            - generic [ref=e6743]: 他願意一直給、一直給, 永遠不嫌累。
                            - generic [ref=e6748]: "今天 — 試著做一個小小的「伏藏」: 默默幫一個人, 不要讓他知道是你。"
                            - generic [ref=e6751]: 那一刻, 你就跟地藏菩薩一樣了。
                            - generic [ref=e6756]: ───────────
                            - generic [ref=e6761]: 💡 明日預告
                            - generic [ref=e6766]: "第 7 篇 — 「佛讚地藏之二 · 喻如諸物」:"
                            - generic [ref=e6769]: "佛陀繼續說: 地藏菩薩照行善者像太陽, 照失道者像火炬, 除煩惱熱像月清涼......"
                            - generic [ref=e6774]: ───────────
