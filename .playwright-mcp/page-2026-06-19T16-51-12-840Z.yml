                      - text: 🌸【地藏十輪經系列 · 第 3 篇 / 全 100 篇】
                      - text: 四種雨下完後, 大眾的手心裡, 居然出現了會發光的珠子......
                      - text: 親愛的朋友, 早安 🙏
                      - text: 昨天我們看到了 — 南方天空, 飄來香雲、花雲、寶飾雲、衣服雲, 還下了 4 種雨。
                      - text: 今天 — 大家會發現自己身上, 出現了奇怪又神奇的東西。
                      - text: ───────────
                      - text: "📖 經文原文:"
                      - text: 「爾時, 一切諸來大眾, 鹹見如是種種雲雨, 亦聞如是諸法音聲, 隨意所樂, 各見其身種種香花、寶飾、衣服之所莊嚴。又各自見兩手掌中持如意珠, 從是一一如意珠中雨種種寶。」
                      - text: ✨ 「鹹見」= 大家都看見
                      - text: ✨ 「如意珠」(讀作 ㄖㄨˊ ㄧˋ ㄓㄨ) = 會實現願望的寶珠
                      - text: ✨ 「兩手掌中」= 在手掌裡
                      - text: ───────────
                      - text: 雨停了, 大家還在仰望天空。
                      - text: 突然, 一位苾芻低頭看自己 — 「啊!」
                      - text: 他發現自己身上, 居然穿著一件好漂亮的香花做的衣服!
                      - text: 胸前還有寶石做的飾品, 是剛剛從天上下來的禮物。
                      - text: 「我也是!」「我也是!」
                      - text: "所有人都低頭看自己 — 每個人都收到了不同的禮物:"
                      - text: 🌸 有的人身上掛滿了香花
                      - text: 💎 有的人戴著閃閃發光的寶飾
                      - text: 👘 有的人穿上了柔軟的天衣
                      - text: 奇怪的是 — 每個人收到的禮物都剛好是「自己喜歡的」!
                      - text: 更神奇的事還在後面 ✨
                      - text: 每個人攤開手掌看 — 兩手掌心居然各有一顆會發光的圓珠子!
                      - text: 「這是......如意珠?」一位菩薩驚呼。
                      - text: 如意珠像活的一樣, 在掌心微微旋轉。
                      - text: 從珠子裡, 不停地飄出小寶物 — 珍珠、瑪瑙、寶石, 一個一個從珠子裡跳出來。
                      - text: 但這還不夠神奇。每顆如意珠裡, 同時射出了光明! 🌟
                      - text: 那光明照到生病的人, 病立刻好了 ——
                      - text: 「奇怪, 我的咳嗽不見了!」
                      - text: 「我的腳痛......也不痛了!」
                      - text: 光明照到關在牢裡的人, 鎖鏈居然斷了, 人也被放出來了!
                      - text: 光明照到挨餓的人, 肚子立刻就飽了。
                      - text: 光明照到沒有衣服穿的人, 身上馬上就出現了一件衣服。
                      - text: 光明照到憂愁的人, 心裡立刻變得平安歡喜。
                      - text: ───────────
                      - text: 就在這個奇蹟發生的時刻, 大眾突然發現一件事 ——
                      - text: 全身像被某種力量壓住, 變得好重, 重到舉不起腳!
                      - text: 「咦?我的身體變得好重......」
                      - text: 「我也是, 像被綁住了。」
                      - text: 不是壞事, 但很奇怪。
                      - text: "所有人面面相覷, 心裡都在問:"
                      - text: 「這到底是什麼徵兆?」「什麼人來了, 會這麼神奇?」
                      - text: ───────────
                      - text: 明天 — 一位天神, 會代表所有人, 問佛陀這到底是什麼回事。
                      - text: ───────────
                      - text: 💡 啟發反思
                      - text: "聖嚴法師說: 「真正的禮物, 都是先讓你受感動, 然後才送到。」"
                      - text: 香花、寶飾、衣服、如意珠 — 每個人收到的, 都剛好是自己最想要的。
                      - text: 這不是巧合, 是慈悲的力量, 在了解我們的心。
                      - text: 今天, 試試看 — 留意一下, 生活中是不是也有「剛好你需要」的禮物?
                      - text: 那不是運氣, 是慈悲。
                      - text: ───────────
                      - text: 💡 明日預告
                      - text: "第 4 篇 — 「天帝釋無垢生的提問」:"
                      - text: 一位戴著光明天冠的天神, 從座位起身, 合掌恭敬地問佛陀:「世尊, 為什麼會出現這麼神奇的徵兆?」
                      - text: ───────────
                      - text: 📚 免費索取《地藏菩薩本願經》紙本經書
                      - text: 《地藏菩薩本願經》是地藏法門的基礎, 淺而易懂, 適合初次接觸的朋友。
                      - text: 跟著我們一邊聽《十輪經》故事, 一邊在家讀本願經, 慢慢建立對地藏菩薩的認識。
                      - text: 私訊我們「我要索取地藏經」, 將免費寄送精美紙本經書給您(含郵資)🌸
