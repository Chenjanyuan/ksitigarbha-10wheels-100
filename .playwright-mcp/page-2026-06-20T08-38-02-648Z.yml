                        - generic [ref=e5964]: 🌸【地藏十輪經系列 · 第 7 篇 / 全 100 篇】
                        - generic [ref=e5969]: 佛陀再用 6 個比喻 — 太陽、火炬、月亮、車子、糧食、嚮導......
                        - generic [ref=e5974]: 親愛的朋友, 早安 🙏
                        - generic [ref=e5979]: 昨天 — 佛陀說地藏菩薩是「伏藏」、「明珠」、「眼目」、「導首」。
                        - generic [ref=e5982]: 今天 — 佛陀再用 6 個更貼近生活的比喻, 告訴我們地藏菩薩到底有多重要。
                        - generic [ref=e5987]: ───────────
                        - generic [ref=e5992]: "📖 經文原文:"
                        - generic [ref=e5997]: 「照行善者猶如朗日, 照失道者猶如明炬, 除煩惱熱如月清涼, 如無足者所得車乘, 如遠涉者所備資糧, 如迷方者所逢示導......」
                        - generic [ref=e6002]: ✨ 「朗日」(ㄌㄤˇ ㄖˋ) = 燦爛的太陽
                        - generic [ref=e6005]: ✨ 「明炬」(ㄇㄧㄥˊ ㄐㄩˋ) = 明亮的火把
                        - generic [ref=e6008]: ✨ 「車乘」(ㄔㄜ ㄕㄥˋ) = 車子
                        - generic [ref=e6011]: ✨ 「資糧」(ㄗ ㄌㄧㄤˊ) = 路上吃的糧食
                        - generic [ref=e6014]: ✨ 「示導」= 帶路的人
                        - generic [ref=e6019]: ───────────
                        - generic [ref=e6024]: 佛陀繼續說 ——
                        - generic [ref=e6027]: 「我用 6 個你們熟悉的東西, 來告訴你們地藏菩薩有多重要。」
                        - generic [ref=e6032]: "全場大眾豎起耳朵, 一個一個聽:"
                        - generic [ref=e6037]: ───────────
                        - generic [ref=e6042]: "☀️ 比喻一: 「照行善者猶如朗日」"
                        - generic [ref=e6045]: 你做好事的時候, 地藏菩薩就像太陽 ——
                        - generic [ref=e6048]: 把你照得閃閃發光, 讓善的種子在心裡發芽長大。
                        - generic [ref=e6051]: 沒有太陽, 種子不會長; 沒有地藏, 善心不會強。
                        - generic [ref=e6056]: "🔥 比喻二: 「照失道者猶如明炬」"
                        - generic [ref=e6059]: 你走錯路的時候, 地藏菩薩就像火把 ——
                        - generic [ref=e6062]: 在最黑的夜裡, 突然點亮, 讓你看清「啊, 我走錯了, 回頭吧」。
                        - generic [ref=e6065]: 很多人迷失的時候, 心裡突然一閃, 就是地藏菩薩的火炬。
                        - generic [ref=e6070]: "🌙 比喻三: 「除煩惱熱如月清涼」"
                        - generic [ref=e6073]: 煩惱起來, 心像著火一樣 —
                        - generic [ref=e6076]: 地藏菩薩就像清涼的月亮, 一照下來, 火就熄了。
                        - generic [ref=e6079]: 沒有壓力的、安靜的、清涼的力量, 是他給我們最美的禮物。
                        - generic [ref=e6084]: ───────────
                        - generic [ref=e6089]: "🚗 比喻四: 「如無足者所得車乘」"
                        - generic [ref=e6092]: 沒有腳的人, 走不了路 —
                        - generic [ref=e6095]: 地藏菩薩就像一輛車, 載著我們, 一步一步往菩提道走。
                        - generic [ref=e6098]: 我們再笨、再慢、再不努力, 上了他的車, 就會到。
                        - generic [ref=e6103]: "🍞 比喻五: 「如遠涉者所備資糧」"
                        - generic [ref=e6106]: 修行像走遠路, 沒糧食就餓死 —
                        - generic [ref=e6109]: 地藏菩薩就像我們的乾糧、水壺、便當盒。
                        - generic [ref=e6112]: 走累了, 拿出來吃一口、喝一口, 又有力氣繼續走。
                        - generic [ref=e6117]: "🧭 比喻六: 「如迷方者所逢示導」"
                        - generic [ref=e6120]: 在森林裡迷路的時候, 是不是好希望有個人帶路?
                        - generic [ref=e6123]: 地藏菩薩就是那個人 — 在我們最迷茫的時候, 突然出現。
                        - generic [ref=e6126]: 「往這邊走, 我跟你一起。」
                        - generic [ref=e6131]: ───────────
                        - generic [ref=e6136]: 佛陀說完, 大眾感動地紅了眼眶 ——
                        - generic [ref=e6139]: 「世尊, 您把地藏菩薩說得像我們的家人一樣!」
                        - generic [ref=e6144]: 佛陀微笑點頭:「他, 比家人更近 — 因為他, 從不離開。」
                        - generic [ref=e6149]: ───────────
                        - generic [ref=e6154]: 明天 — 地藏菩薩終於要出場了! 從南方來, 帶著八十百千那庾多眷屬......
                        - generic [ref=e6159]: ───────────
                        - generic [ref=e6164]: 💡 啟發反思
                        - generic [ref=e6169]: "聖嚴法師說: 「最深的慈悲, 是讓人感覺不到壓力的陪伴。」"
                        - generic [ref=e6174]: 太陽、火炬、月亮、車子、糧食、嚮導 — 都不會自己跑來找你。
                        - generic [ref=e6177]: 但只要你願意, 它們永遠在那裡。
                        - generic [ref=e6182]: 今天 — 想一想, 你心裡有沒有一個「總是在那裡」的力量?
                        - generic [ref=e6185]: 那可能就是地藏菩薩, 安靜地陪著你, 沒有要求, 只有溫暖。
                        - generic [ref=e6190]: ───────────
                        - generic [ref=e6195]: 💡 明日預告
                        - generic [ref=e6200]: "第 8 篇 — 「地藏菩薩出場」:"
                        - generic [ref=e6203]: 終於到了這一刻 — 地藏菩薩以神通力, 現聲聞像, 從南方來, 至佛前住......
