                      - combobox [ref=e2210]:
                        - generic [ref=e618]:
                          - generic [ref=e1248]: 🌸【地藏十輪經系列 · 第 1 篇 / 全 100 篇】
                          - generic [ref=e1251]: 佛陀在一座神祕的山上說法, 忽然天空變色了……
                          - generic [ref=e1256]: 親愛的朋友, 早安 🙏
                          - generic [ref=e1261]: 今天開始, 我們要一起讀一部 2500 年前的真實故事。
                          - generic [ref=e1264]: 這個故事被佛陀的弟子記下來, 變成一本經書,
                          - generic [ref=e1267]: 叫做《大乘大集地藏十輪經》。
                          - generic [ref=e1272]: 這本經很厚 — 有 10 卷 8 個品, 比《地藏菩薩本願經》厚 4-5 倍,
                          - generic [ref=e1275]: 故事一個接一個, 非常精彩。
                          - generic [ref=e1278]: 我們會用接下來的 5 個月慢慢說完, 一天一篇。
                          - generic [ref=e1283]: 今天是 第 1 篇 — 神祕的山。
                          - generic [ref=e1288]: ───────────
                          - generic [ref=e1291]: "📖 經文原文:"
                          - generic [ref=e1294]: 「如是我聞:一時, 薄伽梵在佉羅帝耶山, 諸牟尼仙所依住處。」
                          - generic [ref=e1299]: ✨ 「如是我聞」=「我親耳聽到佛陀這樣說的喔!」
                          - generic [ref=e1302]: → 這是阿難尊者說的開場白, 像看影片前的「我親眼看到」一樣。
                          - generic [ref=e1307]: ✨ 「薄伽梵」= 佛陀的尊稱
                          - generic [ref=e1310]: → 意思是「最值得尊敬的覺悟者」。
                          - generic [ref=e1315]: ✨ 「佉羅帝耶山」(讀作 ㄑㄩ ㄌㄨㄛˊ ㄉㄧˋ ㄧㄝˊ)
                          - generic [ref=e1318]: = 一座很特別的山
                          - generic [ref=e1321]: → 山上住著很多修行人(牟尼仙), 像「修行人的村莊」🏔️
                          - generic [ref=e1324]: → 佛陀今天就在這座山上要開示一部新經。
                          - generic [ref=e1329]: ───────────
                          - generic [ref=e1332]: 那是一個清晨。
                          - generic [ref=e1335]: 印度有一座叫做「佉羅帝耶山」的山, 翻成中文有「寂靜光明」的意思。
                          - generic [ref=e1340]: 為什麼叫這個名字? 因為這座山從來不被打擾 ——
                          - generic [ref=e1343]: 🍃 鳥的聲音清脆
                          - generic [ref=e1346]: 🌬️ 風從松林裡穿過時, 像在念經
                          - generic [ref=e1349]: ☁️ 雲飄得很低, 低到可以伸手摸到
                          - generic [ref=e1354]: 山上住著好多好多修行人。
                          - generic [ref=e1357]: 有的在山洞裡打坐, 一坐就是七天七夜不動;
                          - generic [ref=e1360]: 有的在松樹下念經, 念到月亮從東邊升到西邊;
                          - generic [ref=e1363]: 有的拿著缽, 走進山下村莊化緣, 然後再走回山上獨自吃飯。
                          - generic [ref=e1368]: 如果你站在山下抬頭看, 會以為自己看到了「修行人的村莊」。
                          - generic [ref=e1373]: ───────────
                          - generic [ref=e1376]: 那一天, 佛陀坐在山頂的大石頭上。
                          - generic [ref=e1379]: 身邊圍著祂的弟子們。
                          - generic [ref=e1384]: 阿難尊者離佛陀最近 — 他是佛陀的堂弟,
                          - generic [ref=e1387]: 也是最會記憶的弟子。
                          - generic [ref=e1390]: 後來這部經能流傳下來, 全靠他記住了佛陀說的每一個字。
                          - generic [ref=e1395]: 還有一大群「苾芻」(光著頭、穿橙色袈裟的出家人),
                          - generic [ref=e1398]: 一大群「菩薩」(發願幫助大家的修行者),
                          - generic [ref=e1401]: 還有從天上下來的天神、海裡來的龍王、空中的護法神……
                          - generic [ref=e1406]: 整座山被擠得滿滿, 但每個人都安安靜靜, 等著佛陀說話。
                          - generic [ref=e1411]: ───────────
                          - generic [ref=e1414]: 剛剛, 佛陀說完了一部叫《月藏經》的經。
                          - generic [ref=e1417]: "弟子們聽完, 心裡都很滿足, 互相小聲說:"
                          - generic [ref=e1422]: 「今天的法會應該結束了吧?」
                          - generic [ref=e1425]: 「等一下要回茅蓬休息嗎?」
                          - generic [ref=e1428]: 「下山小心啊, 聽說最近山下出現一頭老虎。」
                          - generic [ref=e1433]: 但…… 佛陀沒有起身。
                          - generic [ref=e1438]: 祂只是慢慢地, 看向南方的天空。
                          - generic [ref=e1443]: 阿難尊者抬頭看著天, 手停在念珠上, 動也不動。
                          - generic [ref=e1446]: "他心裡有一個強烈的預感:"
                          - generic [ref=e1449]: 「肯定有一位非常重要的人物 — 要來了。」
                          - generic [ref=e1454]: 那一刻, 山上所有人都不敢呼吸。
                          - generic [ref=e1459]: 明天 — 我們會看到南方天空, 出現了什麼景象。
                          - generic [ref=e1464]: ───────────
                          - generic [ref=e1467]: 💡 啟發反思 (聖嚴法師風格)
                          - generic [ref=e1472]: 聖嚴法師說:「好的事情, 都是慢慢來的。」
                          - generic [ref=e1477]: 想想看, 佛陀為什麼不一開始就直接介紹地藏菩薩?
                          - generic [ref=e1480]: 而是先讓大家等待、靜下心、感受異象?
                          - generic [ref=e1485]: 因為 — 重要的事, 值得我們鄭重對待。
                          - generic [ref=e1490]: "今天看完這篇後, 試試看: 不要急著滑下一個影片。"
                          - generic [ref=e1493]: 給自己一分鐘, 深呼吸三次。
                          - generic [ref=e1498]: 那三次呼吸, 就是您今天的「佉羅帝耶山」🌱
                          - generic [ref=e1503]: ───────────
                          - generic [ref=e1506]: 💡 明日預告
