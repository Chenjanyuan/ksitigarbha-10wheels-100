                        - generic [ref=e673]: "🌸【地藏十輪經系列 · 第 2 篇 / 全 100 篇】 南方天空, 下起了金色的雨, 也下起了花, 還有寶物...... 親愛的朋友, 早安 🙏 昨天我們講到, 佛陀坐在山頂的大石頭上, 慢慢地看向南方天空。 山上所有人, 都屏住呼吸, 等著看會發生什麼事。 今天 — 我們會看到南方天空, 出現一個奇蹟。 ─────────── 📖 經文原文: 「於是南方大香雲來、大花雲來、大妙殊麗寶飾雲來、大妙鮮潔衣服雲來。 雨大香雨、雨大花雨、雨大妙殊麗寶飾雨、雨大妙鮮潔衣服雨。」 ✨ 「雲來」= 雲飄過來 ✨ 「雨」(讀作ㄩˋ, 動詞) = 從天上降下來的意思 ✨ 4 種雲, 帶著 4 種雨, 從南方飄過來。 ─────────── 就在那個安靜的時刻 —— 南方的天空, 像有一個無形的手, 慢慢推開了雲層。 第一片雲飄過來 🌬️ 是淡金色的, 帶著好聞的香氣。 然後從雲裡, 開始下雨了。 但雨點不是水, 是 ☁️ 香水雨! 落在每個人身上, 香香的、暖暖的。 第二片雲飄過來 🌸 是粉紅色的, 像一大團花瓣。 從雲裡, 下起了 🌷 花雨! 有蓮花、有牡丹、有小白花, 落在山上每一個角落, 整座山變成花海。 第三片雲飄過來 ✨ 是會發光的, 像水晶。 從雲裡, 下起了 💎 寶飾雨! 珍珠、瑪瑙、寶石, 全部叮叮噹噹掉下來, 但沒有人想撿 — 因為大家都看呆了。 第四片雲飄過來 🤍 是雪白色的, 飄著美麗的圖案。 從雲裡, 下起了 👘 衣服雨! 柔軟的、莊嚴的天衣, 從天上慢慢飄落, 就像是天上的織女, 把最好的衣服送給人間。 ─────────── 四種雨同時下, 但每一滴都不會打到人。 更神奇的是 — 從雲裡, 還傳出 ✨ 聲音! 不是雷聲, 是「法音」 — 有「智慧的聲音」, 像在告訴大家什麼是真正的智慧; 有「空無相無願的聲音」, 像在說生命的真相; 有「無常的聲音」, 像在提醒: 一切都會變; 有「慈悲喜捨的聲音」, 像在教大家如何愛別人。 整座山, 變成了一個會說法的天空。 弟子們一個個張大眼睛, 心裡想: 「這 — 是誰來了?」 「為什麼會有這麼大的瑞相?」 「南方......到底有誰要來?」 ─────────── 明天 — 我們會看到大眾的反應, 每個人手裡, 都出現了一顆「如意珠」。 ─────────── 💡 啟發反思 聖嚴法師說: 「好事到來之前, 天地會先有徵兆。」 四種雲雨, 不是巧合。 是宇宙在告訴大家: 一位大菩薩, 即將到來。 就像我們生命中, 重要的事發生前, 常常會有一些「預感」、「巧合」、「特別的夢」。 不要忽略這些 — 那是天地給你的提示, 提醒你: 「準備好, 重要的時刻到了。」 今天, 安靜下來感受一下身邊有沒有什麼「巧合」, 也許那就是你的「香雨花雨」。 ─────────── 💡 明日預告 第 3 篇 — 「大眾掌心的如意珠」: 就在四種雨下完後, 大眾發現自己兩手掌心, 竟然出現了會發光的如意珠...... ─────────── 📚 免費索取《地藏菩薩本願經》紙本經書 《地藏菩薩本願經》是地藏法門的基礎, 淺而易懂, 適合初次接觸的朋友。 跟著我們一邊聽《十輪經》故事, 一邊在家讀本願經, 慢慢建立對地藏菩薩的認識。 私訊我們「我要索取地藏經」, 將免費寄送精美紙本經書給您(含郵資)🌸 #地藏十輪經 #地藏菩薩 #第2篇 #香雨花雨 #南方瑞相 #地藏菩薩本願經 #每日佛經 #台灣佛教"
