                      - generic [ref=e323]:
                        - combobox "在對話方塊中寫點內容，即可為貼文加上文字。" [ref=e327]:
                          - generic [ref=e328]:
                            - generic [ref=e2413]: 🌸【地藏十輪經系列 · 第 5 篇 / 全 100 篇】
                            - generic [ref=e2418]: 佛陀終於開口了 — 「有一位菩薩, 名字叫地藏......」
                            - generic [ref=e2423]: 親愛的朋友, 早安 🙏
                            - generic [ref=e2428]: "昨天 — 天帝釋無垢生代表大家發問: 「這些徵兆, 到底是誰要來?」"
                            - generic [ref=e2431]: 全場大眾屏住呼吸, 等著佛陀的答案。
                            - generic [ref=e2436]: 今天 — 佛陀微微一笑, 終於說出了那個名字。
                            - generic [ref=e2441]: ───────────
                            - generic [ref=e2446]: "📖 經文原文:"
                            - generic [ref=e2451]: "「爾時, 世尊告無垢生天帝釋曰: 汝等當知, 有菩薩摩訶薩, 名曰地藏, 已於無量無數大劫, 五濁惡時, 無佛世界, 成熟有情。今與八十百千那庾多頻跋羅菩薩俱, 為欲來此禮敬、親近、供養我故......」"
                            - generic [ref=e2456]: ✨ 「告」(ㄍㄠˋ) = 對誰說話
                            - generic [ref=e2459]: ✨ 「無量無數大劫」= 數不清的非常非常久時間
                            - generic [ref=e2462]: ✨ 「五濁惡時」= 五種混濁的時代 (劫濁、見濁、煩惱濁、眾生濁、命濁)
                            - generic [ref=e2465]: ✨ 「無佛世界」= 沒有佛陀出世的世界
                            - generic [ref=e2468]: ✨ 「成熟有情」= 讓眾生的善根長大、成熟
                            - generic [ref=e2471]: ✨ 「那庾多」(ㄋㄚˋ ㄩˇ ㄉㄨㄛ) = 古印度大數字, 約等於億
                            - generic [ref=e2474]: ✨ 「頻跋羅」(ㄆㄧㄣˊ ㄅㄚˊ ㄌㄨㄛˊ) = 更大的數字
                            - generic [ref=e2479]: ───────────
                            - generic [ref=e2484]: "佛陀慢慢看向無垢生, 用溫柔的聲音說:"
                            - generic [ref=e2487]: 「你們都要知道 — 有一位大菩薩, 名字叫『地藏』。」
                            - generic [ref=e2492]: 全場大眾屏息 ——「地藏!」
                            - generic [ref=e2495]: 這個名字, 很多人從來沒聽過。
                            - generic [ref=e2500]: "佛陀繼續說:"
                            - generic [ref=e2503]: 「他在很久很久以前 — 久到我們連數字都數不完 — 就一直在做一件事。
                            - generic [ref=e2506]: 在那些沒有佛陀的世界裡, 在最壞、最亂、最苦的時代, 他從來沒有離開。」
                            - generic [ref=e2511]: ───────────
                            - generic [ref=e2516]: 「五濁惡時」是什麼?
                            - generic [ref=e2519]: 佛陀說的這個時代, 就像我們現在一樣 ——
                            - generic [ref=e2524]: "☁️ 劫濁: 時代很亂, 戰爭瘟疫不斷"
                            - generic [ref=e2527]: "☁️ 見濁: 大家想法偏差, 是非顛倒"
                            - generic [ref=e2530]: "☁️ 煩惱濁: 貪心瞋心癡心很重"
                            - generic [ref=e2533]: "☁️ 眾生濁: 人心冷漠, 互相傷害"
                            - generic [ref=e2536]: "☁️ 命濁: 壽命短, 災禍多"
                            - generic [ref=e2541]: 在這樣的時代, 連佛陀都沒有出世 —
                            - generic [ref=e2544]: 但地藏菩薩, 一個人, 默默地進去, 一個一個救。
                            - generic [ref=e2549]: ───────────
                            - generic [ref=e2554]: "佛陀又說:"
                            - generic [ref=e2557]: 「今天, 他來了 — 而且不是自己來。
                            - generic [ref=e2560]: 帶了八十百千那庾多頻跋羅位菩薩眷屬, 一起來。」
                            - generic [ref=e2565]: 「八十百千那庾多頻跋羅」是多少?
                            - generic [ref=e2568]: 連算數最厲害的人都算不出來 — 那是一個天文數字的軍團。
                            - generic [ref=e2573]: 全場一片驚嘆 ——「這麼多!」
                            - generic [ref=e2576]: "想像一下: 一座山頭, 突然要來幾億位菩薩, 那是什麼樣的場面?"
                            - generic [ref=e2581]: ───────────
                            - generic [ref=e2586]: "佛陀補了一句:"
                            - generic [ref=e2589]: 「他們來, 是為了 —」
                            - generic [ref=e2594]: 1. 禮敬我 🙏
                            - generic [ref=e2597]: 2. 親近我 (聽我說法) 📿
                            - generic [ref=e2600]: 3. 供養我 🌸
                            - generic [ref=e2603]: 4. 來看這場大法會, 心中歡喜隨喜 ✨
                            - generic [ref=e2608]: 全場大眾這才恍然大悟 ——
                            - generic [ref=e2611]: 「原來如此! 那些香雨花雨、如意珠、光明, 都是地藏菩薩快到了的徵兆!」
                            - generic [ref=e2616]: ───────────
                            - generic [ref=e2621]: 明天 — 佛陀會開始讚嘆地藏菩薩的功德, 像翻開一本厚厚的功德簿......
                            - generic [ref=e2626]: ───────────
                            - generic [ref=e2631]: 💡 啟發反思
                            - generic [ref=e2636]: "聖嚴法師說: 「最偉大的人, 往往在最沒有人看見的地方做事。」"
                            - generic [ref=e2641]: 地藏菩薩, 不是只在有佛陀的時候才出現。
                            - generic [ref=e2644]: 他選擇的, 都是「最難的地方」、「最苦的時代」、「最沒人去的角落」。
                            - generic [ref=e2649]: 今天 — 想想看, 我們身邊有沒有人, 默默地在做一些別人不想做的事?
                            - generic [ref=e2652]: 那, 就是地藏菩薩的影子。
                            - generic [ref=e2655]: 看見了, 就跟他說一聲謝謝。
                            - generic [ref=e2660]: ───────────
                            - generic [ref=e2665]: 💡 明日預告
                            - generic [ref=e2670]: "第 6 篇 — 「佛讚地藏之一 · 伏藏明珠」:"
                            - generic [ref=e2673]: 佛陀說:「這位大菩薩, 是諸多微妙功德的伏藏, 是諸解脫珍寶出處......」
                            - generic [ref=e2678]: ───────────
                            - generic [ref=e2683]: 📚 免費索取《地藏菩薩本願經》紙本經書
                            - generic [ref=e2688]: 《地藏菩薩本願經》是地藏法門的基礎, 淺而易懂, 適合初次接觸的朋友。
                            - generic [ref=e2691]: 跟著我們一邊聽《十輪經》故事, 一邊在家讀本願經, 慢慢建立對地藏菩薩的認識。
                            - generic [ref=e2696]: 私訊我們「我要索取地藏經」, 將免費寄送精美紙本經書給您(含郵資)🌸
