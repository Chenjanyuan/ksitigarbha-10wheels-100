                            - generic [ref=e1561]: 🌸【地藏十輪經系列 · 第 2 篇 / 全 100 篇】
                            - generic [ref=e1564]: 南方天空, 下起了金色的雨, 也下起了花, 還有寶物......
                            - generic [ref=e1571]: 親愛的朋友, 早安 🙏
                            - generic [ref=e1578]: 昨天我們講到, 佛陀坐在山頂的大石頭上, 慢慢地看向南方天空。
                            - generic [ref=e1581]: 山上所有人, 都屏住呼吸, 等著看會發生什麼事。
                            - generic [ref=e1588]: 今天 — 我們會看到南方天空, 出現一個奇蹟。
                            - generic [ref=e1595]: ───────────
                            - generic [ref=e1598]: "📖 經文原文:"
                            - generic [ref=e1601]: 「於是南方大香雲來、大花雲來、大妙殊麗寶飾雲來、大妙鮮潔衣服雲來。
                            - generic [ref=e1604]: 雨大香雨、雨大花雨、雨大妙殊麗寶飾雨、雨大妙鮮潔衣服雨。」
                            - generic [ref=e1611]: ✨ 「雲來」= 雲飄過來
                            - generic [ref=e1614]: ✨ 「雨」(讀作ㄩˋ, 動詞) = 從天上降下來的意思
                            - generic [ref=e1617]: ✨ 4 種雲, 帶著 4 種雨, 從南方飄過來。
                            - generic [ref=e1624]: ───────────
                            - generic [ref=e1627]: 就在那個安靜的時刻 ——
                            - generic [ref=e1630]: 南方的天空, 像有一個無形的手, 慢慢推開了雲層。
                            - generic [ref=e1637]: 第一片雲飄過來 🌬️
                            - generic [ref=e1640]: 是淡金色的, 帶著好聞的香氣。
                            - generic [ref=e1643]: 然後從雲裡, 開始下雨了。
                            - generic [ref=e1646]: 但雨點不是水, 是 ☁️ 香水雨!
                            - generic [ref=e1649]: 落在每個人身上, 香香的、暖暖的。
                            - generic [ref=e1656]: 第二片雲飄過來 🌸
                            - generic [ref=e1659]: 是粉紅色的, 像一大團花瓣。
                            - generic [ref=e1662]: 從雲裡, 下起了 🌷 花雨!
                            - generic [ref=e1665]: 有蓮花、有牡丹、有小白花,
                            - generic [ref=e1668]: 落在山上每一個角落, 整座山變成花海。
                            - generic [ref=e1675]: 第三片雲飄過來 ✨
                            - generic [ref=e1678]: 是會發光的, 像水晶。
                            - generic [ref=e1681]: 從雲裡, 下起了 💎 寶飾雨!
                            - generic [ref=e1684]: 珍珠、瑪瑙、寶石, 全部叮叮噹噹掉下來,
                            - generic [ref=e1687]: 但沒有人想撿 — 因為大家都看呆了。
                            - generic [ref=e1694]: 第四片雲飄過來 🤍
                            - generic [ref=e1697]: 是雪白色的, 飄著美麗的圖案。
                            - generic [ref=e1700]: 從雲裡, 下起了 👘 衣服雨!
                            - generic [ref=e1703]: 柔軟的、莊嚴的天衣, 從天上慢慢飄落,
                            - generic [ref=e1706]: 就像是天上的織女, 把最好的衣服送給人間。
                            - generic [ref=e1713]: ───────────
                            - generic [ref=e1716]: 四種雨同時下, 但每一滴都不會打到人。
                            - generic [ref=e1719]: 更神奇的是 — 從雲裡, 還傳出 ✨ 聲音!
                            - generic [ref=e1726]: 不是雷聲, 是「法音」 —
                            - generic [ref=e1729]: 有「智慧的聲音」, 像在告訴大家什麼是真正的智慧;
                            - generic [ref=e1732]: 有「空無相無願的聲音」, 像在說生命的真相;
                            - generic [ref=e1735]: "有「無常的聲音」, 像在提醒: 一切都會變;"
                            - generic [ref=e1738]: 有「慈悲喜捨的聲音」, 像在教大家如何愛別人。
                            - generic [ref=e1745]: 整座山, 變成了一個會說法的天空。
                            - generic [ref=e1752]: "弟子們一個個張大眼睛, 心裡想:"
                            - generic [ref=e1755]: 「這 — 是誰來了?」
                            - generic [ref=e1758]: 「為什麼會有這麼大的瑞相?」
                            - generic [ref=e1761]: 「南方......到底有誰要來?」
                            - generic [ref=e1768]: ───────────
                            - generic [ref=e1771]: 明天 — 我們會看到大眾的反應, 每個人手裡, 都出現了一顆「如意珠」。
                            - generic [ref=e1778]: ───────────
                            - generic [ref=e1781]: 💡 啟發反思
                            - generic [ref=e1788]: "聖嚴法師說: 「好事到來之前, 天地會先有徵兆。」"
                            - generic [ref=e1795]: 四種雲雨, 不是巧合。
                            - generic [ref=e1798]: "是宇宙在告訴大家: 一位大菩薩, 即將到來。"
                            - generic [ref=e1801]: 就像我們生命中, 重要的事發生前, 常常會有一些「預感」、「巧合」、「特別的夢」。
                            - generic [ref=e1804]: "不要忽略這些 — 那是天地給你的提示, 提醒你: 「準備好, 重要的時刻到了。」"
                            - generic [ref=e1811]: 今天, 安靜下來感受一下身邊有沒有什麼「巧合」, 也許那就是你的「香雨花雨」。
                            - generic [ref=e1818]: ───────────
