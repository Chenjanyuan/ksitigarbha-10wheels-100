                  - gridcell "Facebook 13品之4 地藏菩薩的久遠劫大願 地藏菩薩的願力有多大？ 虛空藏菩薩問佛陀：「地藏菩薩是什麼時候發的願？為什麼他的願力這麼大？」 佛陀說：「地藏菩薩發願的時間，已經不是一劫、兩劫，而是久遠劫以前就開始了。」 🌟 久遠劫的意義 什麼是「劫」？ 劫是非常非常長的時間 一劫有多長？想像把一座高山，用輕紗每一百年擦一次，等到山都被擦平了，這才是一劫 久遠劫，就是數不清的劫 地藏菩薩的願力 在這麼長的時間裡，地藏菩薩一直在發願 一次又一次，生生世世，從不間斷 每一次發願，都是為了救度眾生 🌟 地藏菩薩的大願 「地獄不空，誓不成佛」 只要還有一個眾生在地獄受苦 地藏菩薩就不願意自己先成佛 要等到所有眾生都得救了，他才願意成佛 「眾生度盡，方證菩提」 要把所有的眾生都救度了 才願意證得最高的智慧（菩提） 這是多麼偉大的願力！ 🌟 為什麼要發這麼大的願？ 一、慈悲心 看到眾生受苦，心裡很難過，想要幫助他們。 二、孝順心 最初是為了救母親，後來擴大到要救所有人的母親。 三、平等心 不管是誰，只要在受苦，都要去救。 四、堅持的心 不是一時的衝動，而是永遠的承諾。 🌈 啟發反思 一、願力的力量 有願力的人，就有方向和動力，不會迷失。 二、從小願到大願 可以先從小願開始，慢慢擴大。比如先幫助家人，再幫助更多人。 三、堅持很重要 發願容易，堅持難。要像地藏菩薩一樣，永不放棄。 四、我們也可以發願 不一定要發很大的願，但可以發一個適合自己的願，然後努力去實現。 💬 佛語小語 「久遠劫來發大願，地獄不空不成佛；眾生度盡方菩提，願力堅定永不退。」🙏 📚 免費索取《地藏菩薩本願經》 想深入了解地藏菩薩的功德嗎？📩 私訊「我要索取地藏經」，我們將免費寄送精美經書給您（含郵資）。讓我們一起學習菩薩的慈悲與願力！🌸 多媒體 地藏菩薩 經典導讀 載入中…… 開啟下拉式功能表" [ref=e2954]:
