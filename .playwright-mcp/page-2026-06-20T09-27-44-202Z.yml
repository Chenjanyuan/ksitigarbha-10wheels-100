                - row "選擇含有 ID（1363825759112769）的項目 Facebook 第13品之2：地藏的承諾 地藏菩薩的莊嚴承諾！ 聽到佛陀的囑託後，地藏菩薩雙手合十，跪在佛陀面前，用堅定而恭敬的聲音回答：「世尊！請您不要擔心！」 「在佛陀入滅之後，到彌勒佛出世之前，這段時間裡，我一定會用我的神通力和智慧力，救度所有的眾生，讓他們都能解脫痛苦。」 「如果有眾生造了惡業，即將墮入惡道，只要他們能念我的名號，或者看到我的形像，或者聽到《地藏經》，我一定會用各種方法救度他們，讓他們不墮惡道。」 地藏菩薩說完後，再次向佛陀頂禮，表示他一定會完成這個神聖的使命。 🌟 地藏菩薩的承諾 一、請佛勿憂 地藏菩薩安慰佛陀，請佛陀放心。 二、誓願救度 承諾在無佛時代，負起救度眾生的責任。 三、多種方法 用神通力、智慧力、各種善巧方便來救度眾生。 四、絕不放棄 只要眾生與他結緣，他一定會救度，絕不放棄任何一個眾生。 🌈 啟發反思 一、承諾的力量 地藏菩薩的承諾不是隨便說說，而是用生命去實踐的誓願。這種承諾的力量,感動天地。 二、我們的依靠 有了地藏菩薩的承諾，我們在這個無佛時代就有了依靠。只要我們念他的名號，他一定會來幫助我們。 三、學習承諾 我們也要學習地藏菩薩，對自己的承諾負責。答應別人的事，要努力做到。 四、感恩與信心 我們要感恩地藏菩薩的承諾，也要對他有信心。相信他一定會守護我們。 💬 佛語小語 「菩薩承諾不虛言，誓救眾生出苦淵；只要念名結善緣，定蒙救度到彼岸。」 菩薩承諾，永不放棄。🙏 📚 免費索取《地藏菩薩本願經》 想深入了解地藏菩薩的功德嗎？📩 私訊「我要索取地藏經」，我們將免費寄送精美經書給您（含郵資）。讓我們一起學習菩薩的慈悲與願力！🌸 多媒體 地藏菩薩 經典導讀 開啟下拉式功能表 3月25日 7:00 目前未加強推廣 74 106 74 0 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中……" [ref=e3402] [cursor=pointer]:
