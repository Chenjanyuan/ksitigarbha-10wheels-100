                  - gridcell "Facebook 13品之1：佛陀的託付 佛陀把眾生託付給地藏菩薩！ 這時候，佛陀從座位上站起來，用他的金色手臂，摸著地藏菩薩的頭頂，對他說：「地藏！地藏！你的神通力、慈悲力、智慧力、辯才力，真是不可思議！」 「即使十方諸佛，用一千劫的時間來讚歎你的功德，也說不完。」 佛陀接著說：「地藏！地藏！你要記住我今天在忉利天宮，在這麼多天神、人類、以及一切眾生面前，再一次把還沒有解脫的眾生，託付給你。」 「在我入滅之後，到彌勒菩薩成佛之前，這段沒有佛住世的時間裡，你要用你的神通力，救度這些眾生，讓他們都能解脫痛苦，不要讓他們墮入惡道。」 🌟 佛陀的囑託 一、摩頂授記 佛陀親手摸地藏菩薩的頭頂，表示最高的信任和託付。 二、讚歎功德 佛陀說，即使所有佛一起讚歎一千劫，也說不完地藏菩薩的功德。 三、託付眾生 佛陀把所有還沒解脫的眾生，都託付給地藏菩薩照顧。 四、時間範圍 從釋迦牟尼佛入滅，到彌勒佛出世，這段漫長的「無佛時代」，地藏菩薩要負責救度眾生。 🌈 啟發反思 一、無佛時代 我們現在就生活在「無佛時代」。釋迦牟尼佛已經入滅，彌勒佛還沒來。在這個時代，地藏菩薩就是我們最大的依靠。 二、佛陀的信任 佛陀為什麼把眾生託付給地藏菩薩？因為地藏菩薩有能力、有願力、有慈悲心。這是對地藏菩薩最高的信任。 三、我們的責任 地藏菩薩接受了佛陀的託付，努力救度眾生。我們也應該接受菩薩的教導，努力修行，不辜負佛菩薩的期望。 四、感恩的心 我們要感恩地藏菩薩。在這個沒有佛的時代，他默默守護著我們，給我們希望和力量。 💬 佛語小語 「佛陀摩頂囑地藏，千劫讚歎說不完；無佛時代菩薩護，眾生有靠不孤單。」 佛陀託付，菩薩守護。🙏 📚 免費索取《地藏菩薩本願經》 想深入了解地藏菩薩的功德嗎？📩 私訊「我要索取地藏經」，我們將免費寄送精美經書給您（含郵資）。讓我們一起學習菩薩的慈悲與願力！🌸 多媒體 地藏菩薩 經典導讀 開啟下拉式功能表" [ref=e3562]:
