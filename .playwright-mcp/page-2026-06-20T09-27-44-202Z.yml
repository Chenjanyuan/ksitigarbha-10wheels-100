                - row "選擇含有 ID（1364794299015915）的項目 Facebook 復次普廣。若未來世眾生。於月一日。八日。十四日。十五日。十八日。二十三。二十四。二十八。二十九日。乃至三十日。是諸日等。諸罪結集。定其輕重。南閻浮提眾生。舉止動念。無不是業。無不是罪。何況恣情殺害竊盜邪淫妄語。百千罪狀。能於是十齋日。對佛菩薩。諸賢聖像前。讀是經一徧（ㄅㄧㄢˋ）。東西南北。百由旬內。無諸災難。當此居家。若長若幼。現在未來。百千歲中。永離惡趣。能於十齋日。每轉一徧（ㄅㄧㄢˋ）。現世令此居家。無諸橫病。衣食豐溢。 相片 地藏菩薩 經典導讀 開啟下拉式功能表 3月26日 6:00 目前未加強推廣 47 64 46 0 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中……" [ref=e3250] [cursor=pointer]:
