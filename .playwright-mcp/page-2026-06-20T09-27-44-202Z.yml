                - row "選擇含有 ID（1370058048489540）的項目 Facebook 📅 第13品之6：地藏菩薩的慈悲救度 地藏菩薩如何救度眾生？ 佛陀說：「地藏菩薩救度眾生，是沒有分別心的。不管你是誰，不管你做過什麼，只要你願意改過，地藏菩薩都會來幫助你。」 🌟 慈悲的特質 一、無條件的愛 不會因為你做錯事就不理你 不會因為你很窮就看不起你 不會因為你不聰明就放棄你 二、永不放棄 即使你一次又一次犯錯 即使你不相信他 即使你忘記他 地藏菩薩都不會放棄你 三、主動救度 不用等你求救 只要你有需要 地藏菩薩就會來幫忙 🌟 救度的方法 一、救度身體的苦 生病時，幫助你康復 遇到危險時，保護你平安 缺乏時，讓你得到所需 二、救度心靈的苦 害怕時，給你勇氣 悲傷時，給你安慰 迷惑時，給你指引 三、救度未來的苦 教你做對的事 讓你不要再受苦 幫你走向光明的未來 🌟 救度不分對象 好人和壞人都救 好人，讓他們更好 壞人，幫他們改過 富人和窮人都救 富人，教他們惜福 窮人,幫他們脫困 聰明人和笨人都救 聰明人，教他們智慧 笨人，用簡單的方法教 人類和動物都救 不只救人 連動物也救 🌈 啟發反思 一、真正的愛是無條件的 不是因為對方好才愛，而是無論如何都愛。 二、每個人都值得被救 不要放棄任何人，包括自己。 三、幫助別人不要有分別心 不要選擇性地幫助，而是看到需要就幫。 四、永不放棄希望 無論現在多困難，都有改變的可能。 💬 佛語小語 「慈悲救度無分別，好壞貧富皆平等；永不放棄任何人，只要願改必得度。」🙏 📚 免費索取《地藏菩薩本願經》 想深入了解地藏菩薩的功德嗎？📩 私訊「我要索取地藏經」，我們將免費寄送精美經書給您（含郵資）。讓我們一起學習菩薩的慈悲與願力！🌸 多媒體 地藏菩薩 經典導讀 開啟下拉式功能表 4月1日 7:00 目前未加強推廣 44 68 44 0 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中…… 載入中……" [ref=e2490] [cursor=pointer]:
