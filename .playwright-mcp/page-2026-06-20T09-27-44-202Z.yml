                  - gridcell "Facebook 📅 第13品之5：地藏菩薩的無量化身 地藏菩薩如何救度這麼多眾生？ 佛陀繼續說：「地藏菩薩為了救度眾生，化現出無量無邊的化身，到各個世界去幫助需要幫助的人。」 🌟 什麼是化身？ 化身的意義 就像孫悟空會變身一樣 地藏菩薩可以同時變成很多很多個自己 每一個化身都可以去幫助不同的眾生 為什麼要化身？ 因為需要幫助的眾生太多了 一個身體來不及救所有人 所以要化成千千萬萬個身體 🌟 地藏菩薩化身的種類 一、化身為出家人 變成和尚或尼姑 教導人們佛法 幫助人們修行 二、化身為國王大臣 變成有權力的人 用好的政策幫助百姓 讓社會更和平 三、化身為普通人 變成你我身邊的人 可能是老師、醫生、朋友 在我們需要時給予幫助 四、化身到地獄 到最苦的地方去 救度受苦的眾生 給他們希望和安慰 🌟 千百億化身的力量 同時在不同地方 在天上教導天人 在人間幫助人類 在地獄救度罪人 在動物道保護動物 用不同的方法 對有智慧的人，講深奧的道理 對普通人，講簡單的道理 對小孩，用故事來教導 對不同的人，用不同的方法 🌈 啟發反思 一、菩薩無處不在 地藏菩薩可能就在我們身邊，只是我們不知道。 二、幫助別人的方法很多 不一定要做大事，小小的幫助也很重要。 三、要有彈性 對不同的人，要用不同的方法，才能真正幫到他們。 四、一個人也可以做很多事 雖然我們不能像菩薩一樣化身，但可以在不同的時間、不同的地方幫助不同的人。 💬 佛語小語 「千百億化身遍十方，隨類現形度眾生；天上人間及地獄，處處都有地藏尊。」🙏 📚 免費索取《地藏菩薩本願經》 想深入了解地藏菩薩的功德嗎？📩 私訊「我要索取地藏經」，我們將免費寄送精美經書給您（含郵資）。讓我們一起學習菩薩的慈悲與願力！🌸 多媒體 地藏菩薩 經典導讀 開啟下拉式功能表" [ref=e2802]:
