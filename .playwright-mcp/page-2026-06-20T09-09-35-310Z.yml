                        - generic [ref=e1196]:
                          - generic [ref=e2300]: 🌸【地藏十輪經系列 · 第 8 篇 / 全 100 篇】
                          - generic [ref=e2305]: 地藏菩薩終於登場! 從南方來, 不是華麗的造型, 而是......
                          - generic [ref=e2310]: 親愛的朋友, 早安 🙏
                          - generic [ref=e2315]: 連續 7 天 — 香雨花雨、如意珠、光明、問答、佛陀讚嘆。
                          - generic [ref=e2318]: 所有的鋪陳, 都是為了這一刻 ——
                          - generic [ref=e2323]: 今天 — 地藏菩薩, 出場了!
                          - generic [ref=e2328]: ───────────
                          - generic [ref=e2333]: "📖 經文原文:"
                          - generic [ref=e2338]: 「世尊說是地藏菩薩諸功德已, 爾時, 地藏菩薩摩訶薩與八十百千那庾多頻跋羅菩薩, 以神通力, 現聲聞像, 從南方來, 至佛前住, 與諸眷屬, 恭敬頂禮世尊雙足, 右繞三匝, 在如來前, 合掌而立......」
                          - generic [ref=e2343]: ✨ 「神通力」= 不可思議的法力
                          - generic [ref=e2346]: ✨ 「現聲聞像」= 變現成出家比丘的樣子
                          - generic [ref=e2349]: ✨ 「頂禮雙足」= 用額頭碰佛陀雙腳, 最高禮節
                          - generic [ref=e2352]: ✨ 「右繞三匝」(ㄗㄚ) = 順時鐘繞三圈, 表示恭敬
                          - generic [ref=e2357]: ───────────
                          - generic [ref=e2362]: 南方的天空, 突然亮起來 ——
                          - generic [ref=e2365]: 一道金光, 從很遠很遠的地方, 慢慢往山頂飄來。
                          - generic [ref=e2370]: 全場大眾抬頭看 ——
                          - generic [ref=e2373]: 「來了! 來了!」
                          - generic [ref=e2378]: 奇怪的是 — 大家本來以為會看到華麗的菩薩造型 —
                          - generic [ref=e2381]: 頭戴寶冠、身披瓔珞、腳踏蓮花......
                          - generic [ref=e2386]: 但 — 出現的, 卻是「出家比丘」的樣子!
                          - generic [ref=e2391]: ───────────
                          - generic [ref=e2396]: 光明散去後, 大眾看清楚了 ——
                          - generic [ref=e2401]: 前面, 是一位年輕的比丘, 光頭、橙色袈裟、手持錫杖。
                          - generic [ref=e2404]: 他的臉, 慈悲莊嚴, 眼神溫柔。
                          - generic [ref=e2407]: 那, 就是地藏菩薩!
                          - generic [ref=e2412]: 後面 — 是八十百千那庾多 (數不清) 位菩薩眷屬,
                          - generic [ref=e2415]: 每一位都跟地藏菩薩一樣, 現出聲聞 (出家比丘) 的造型,
                          - generic [ref=e2418]: 光頭、袈裟、整齊有序, 像一支莊嚴的僧團。
                          - generic [ref=e2423]: 全場大眾倒吸一口氣 ——
                          - generic [ref=e2426]: 「為什麼這位大菩薩, 不是穿華麗天衣, 卻穿出家人的袈裟?」
                          - generic [ref=e2431]: ───────────
                          - generic [ref=e2436]: 地藏菩薩慢慢走到佛陀面前。
                          - generic [ref=e2441]: 他停下來, 慢慢彎腰, 用額頭碰到佛陀的雙腳 ——
                          - generic [ref=e2444]: 這是印度最尊敬的禮節, 叫「頂禮雙足」。
                          - generic [ref=e2449]: 接著, 他站起來, 順時鐘繞著佛陀走了三圈 (右繞三匝)。
                          - generic [ref=e2452]: 每走一圈, 都微微點頭, 表示「無上恭敬」。
                          - generic [ref=e2457]: 八十百千那庾多眷屬, 也都跟著, 一一頂禮, 一一繞圈。
                          - generic [ref=e2460]: 整個山頂, 像一場最莊嚴的儀式。
                          - generic [ref=e2465]: ───────────
                          - generic [ref=e2470]: 繞完三圈, 地藏菩薩回到佛陀面前 ——
                          - generic [ref=e2473]: 雙手合掌, 安靜站立。
                          - generic [ref=e2478]: 沒有說話, 但全場都感受到 ——
                          - generic [ref=e2481]: 「這位菩薩, 從他出現的那一刻, 就讓人感覺好安心。」
                          - generic [ref=e2486]: ───────────
                          - generic [ref=e2491]: 明天 — 地藏菩薩會用最美的詩偈, 來讚頌佛陀......
                          - generic [ref=e2496]: ───────────
                          - generic [ref=e2501]: 💡 啟發反思
                          - generic [ref=e2506]: "聖嚴法師說: 「真正有德的人, 都不需要華麗的外表。」"
                          - generic [ref=e2511]: 地藏菩薩明明可以變成最華麗的造型, 卻選擇現出家比丘像。
                          - generic [ref=e2514]: "因為他要告訴我們: 修行人的莊嚴, 不在衣服, 在心。"
                          - generic [ref=e2519]: 今天 — 看看身邊, 那些安靜、樸素、默默做事的人 —
                          - generic [ref=e2522]: 他們的「莊嚴」, 比那些大聲喧嘩的人, 更貼近地藏菩薩的樣子。
                          - generic [ref=e2527]: ───────────
                          - generic [ref=e2532]: 💡 明日預告
                          - generic [ref=e2537]: "第 9 篇 — 「地藏禮讚佛偈 · 上」:"
                          - generic [ref=e2540]: 地藏菩薩開始用詩歌讚嘆佛陀:「兩足尊導師, 慈心常普覆, 安忍如大地......」
                          - generic [ref=e2545]: ───────────
                          - generic [ref=e2550]: 📚 免費索取《地藏菩薩本願經》紙本經書
                          - generic [ref=e2555]: 《地藏菩薩本願經》是地藏法門的基礎, 淺而易懂, 適合初次接觸的朋友。
                          - generic [ref=e2558]: 跟著我們一邊聽《十輪經》故事, 一邊在家讀本願經, 慢慢建立對地藏菩薩的認識。
                          - generic [ref=e2563]: 私訊我們「我要索取地藏經」, 將免費寄送精美紙本經書給您(含郵資)🌸
