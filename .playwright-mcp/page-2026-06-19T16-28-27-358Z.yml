                        - generic [ref=e626]: "🌸【地藏十輪經系列 · 第 1 篇 / 全 10#台灣佛教 佛陀在一座神祕的山上說法, 忽然天空變色了…… 親愛的朋友, 早安 🙏 今天開始, 我們要一起讀一部 2500 年前的真實故事。 這個故事被佛陀的弟子記下來, 變成一本經書, 叫做《大乘大集地藏十輪經》。 這本經很厚 — 有 10 卷 8 個品, 比《地藏菩薩本願經》厚 4-5 倍, 故事一個接一個, 非常精彩。 我們會用接下來的 5 個月慢慢說完, 一天一篇。 今天是 第 1 篇 — 神祕的山。 ─────────── 📖 經文原文: 「如是我聞:一時, 薄伽梵在佉羅帝耶山, 諸牟尼仙所依住處。」 ✨ 「如是我聞」=「我親耳聽到佛陀這樣說的喔!」 → 這是阿難尊者說的開場白, 像看影片前的「我親眼看到」一樣。 ✨ 「薄伽梵」= 佛陀的尊稱 → 意思是「最值得尊敬的覺悟者」。 ✨ 「佉羅帝耶山」(讀作 ㄑㄩ ㄌㄨㄛˊ ㄉㄧˋ ㄧㄝˊ) = 一座很特別的山 → 山上住著很多修行人(牟尼仙), 像「修行人的村莊」🏔️ → 佛陀今天就在這座山上要開示一部新經。 ─────────── 那是一個清晨。 印度有一座叫做「佉羅帝耶山」的山, 翻成中文有「寂靜光明」的意思。 為什麼叫這個名字? 因為這座山從來不被打擾 —— 🍃 鳥的聲音清脆 🌬️ 風從松林裡穿過時, 像在念經 ☁️ 雲飄得很低, 低到可以伸手摸到 山上住著好多好多修行人。 有的在山洞裡打坐, 一坐就是七天七夜不動; 有的在松樹下念經, 念到月亮從東邊升到西邊; 有的拿著缽, 走進山下村莊化緣, 然後再走回山上獨自吃飯。 如果你站在山下抬頭看, 會以為自己看到了「修行人的村莊」。 ─────────── 那一天, 佛陀坐在山頂的大石頭上。 身邊圍著祂的弟子們。 阿難尊者離佛陀最近 — 他是佛陀的堂弟, 也是最會記憶的弟子。 後來這部經能流傳下來, 全靠他記住了佛陀說的每一個字。 還有一大群「苾芻」(光著頭、穿橙色袈裟的出家人), 一大群「菩薩」(發願幫助大家的修行者), 還有從天上下來的天神、海裡來的龍王、空中的護法神…… 整座山被擠得滿滿, 但每個人都安安靜靜, 等著佛陀說話。 ─────────── 剛剛, 佛陀說完了一部叫《月藏經》的經。 弟子們聽完, 心裡都很滿足, 互相小聲說: 「今天的法會應該結束了吧?」 「等一下要回茅蓬休息嗎?」 「下山小心啊, 聽說最近山下出現一頭老虎。」 但…… 佛陀沒有起身。 祂只是慢慢地, 看向南方的天空。 阿難尊者抬頭看著天, 手停在念珠上, 動也不動。 他心裡有一個強烈的預感: 「肯定有一位非常重要的人物 — 要來了。」 那一刻, 山上所有人都不敢呼吸。 明天 — 我們會看到南方天空, 出現了什麼景象。 ─────────── 💡 啟發反思 聖嚴法師說:「好的事情, 都是慢慢來的。」 想想看, 佛陀為什麼不一開始就直接介紹地藏菩薩? 而是先讓大家等待、靜下心、感受異象? 因為 — 重要的事, 值得我們鄭重對待。 今天看完這篇後, 試試看: 不要急著滑下一個影片。 給自己一分鐘, 深呼吸三次。 那三次呼吸, 就是您今天的「佉羅帝耶山」🌱 ─────────── 💡 明日預告 第 2 篇 — 「香雨花雨從南方來」: 從南方天空, 飄來一團淡金色的雲, 然後下起香雨、花雨、寶物雨、衣服雨。 而從南方天空, 緩緩走來了一位戴寶冠的菩薩…… ─────────── 📚 免費索取《地藏菩薩本願經》紙本經書 《地藏菩薩本願經》是地藏法門的基礎, 淺而易懂, 適合初次接觸的朋友。 跟著我們一邊聽《十輪經》故事, 一邊在家讀本願經, 慢慢建立對地藏菩薩的認識。 私訊我們「我要索取地藏經」, 將免費寄送精美紙本經書給您(含郵資)🌸 #地藏十輪經 #地藏菩薩 #第1篇 #神祕的山 #佉羅帝耶山 #地藏菩薩本願經 #每日佛經 #台灣佛教"
