                - generic "現有文字" [ref=e2026]:
                  - textbox "現有文字" [disabled] [ref=e2027]: "🌸【地藏十輪經白話圖文連載 · 前言】 明天開始,《地藏十輪經》白話圖文連載,正式開始 🙏 末學想先寫一點心裡話,跟大家分享。 ─────────── 末學此生很有幸,能夠遇到地藏法門。 在人生最低潮、最困難的時候, 是地藏王菩薩的法門,也是佛法, 慢慢扭轉了末學的人生。 末學常常想 —— 如果二十歲就能遇到佛法, 也許人生會走得很不一樣。 也許會少走很多冤枉路,也許會少受很多苦。 但末學也不覺得可惜。 人生的因緣,或許本來就有它的安排。 該遇到的時候,就會遇到。 ─────────── 也因為自己曾經走過低潮, 所以末學更希望,能夠把這一份因緣分享出去。 末學的初衷很簡單 —— 不是要大家死背佛經,也不是要把佛法講得很深奧。 只是希望更多人可以因為接觸佛法, 讓自己的人生過得更好一點、更安定一點、更圓滿一點 ✨ ─────────── 📖 之前末學曾經分享過《地藏菩薩本願經》的圖文內容。 《地藏菩薩本願經》是地藏法門很重要、也很適合入門的一部經典, 內容相對白話,許多人比較容易理解。 末學也一直認為,地藏法門是很適合所有人學習的法門。 所以到目前為止,我們也仍然持續提供《地藏菩薩本願經》這本經書, 讓有需要、有因緣的朋友可以免費索取 🌸 如果您想開始接觸地藏法門, 末學會很建議先從《地藏菩薩本願經》開始。 ─────────── 🌸 另外也跟大家補充一下 —— 我們原本 FB 的方向,是以《地藏菩薩本願經》為主, 希望讓更多人可以接觸地藏法門, 也持續提供《地藏菩薩本願經》讓有緣的朋友免費索取。 後來末學慢慢覺得 —— 地藏法門不只是《地藏菩薩本願經》而已, 還包含《占察善惡業報經》與《地藏十輪經》等重要經典。 所以我們也把 FB 的方向, 從原本比較單一的《地藏菩薩本願經》分享, 慢慢調整成 —— 🌸【地藏菩薩 經典導讀】🌸 希望未來可以用更白話、更容易親近的方式, 慢慢陪大家一起認識地藏菩薩的經典與法門 ✨ ─────────── 📚 地藏三經: 1️⃣《地藏菩薩本願經》 — 入門經典,白話易懂 2️⃣《占察善惡業報經》 — 末學也還不敢說真正懂了 3️⃣《地藏十輪經》 — 這次要分享的 所以這一次,末學想先從《地藏十輪經》開始。 ─────────── 其實《地藏十輪經》這本經書, 大概七、八年前就已經來到末學家裡了。 但它真的很厚。 相信很多人看到這麼厚的經書, 可能還沒開始讀,就已經先覺得有壓力了。 包含末學自己也是。 以前看到這麼厚一本, 真的也很容易放著放著,就一直沒有翻開。 ─────────── 可是這幾年慢慢接觸佛法之後, 末學越來越覺得 —— 佛經真正重要的地方,不只是文字本身, 而是它能不能落實在生活裡 ✨ 佛法不是拿來放在書櫃裡的。 佛法是可以幫助我們面對人生、改善心念、調整行為, 讓生活變得更好的。 所以這一次,末學想盡自己的一點能力, 用最白話、最容易理解的方式, 把《地藏十輪經》的意思介紹給大家。 不敢說是完整講經,也不敢說自己真正懂經。 只是把經文裡面好的觀念,整理成比較容易閱讀的貼文, 再搭配插圖,希望大家比較容易親近 🌸 希望大人看得懂,小朋友也能看懂。 也希望父母可以陪孩子一起看, 讓孩子從小就能接觸善的觀念。 ─────────── 如果您覺得自己暫時還沒有辦法閱讀《地藏菩薩本願經》, 也沒有關係。 末學自己以前剛開始念《地藏菩薩本願經》的時候, 也常常念沒多久就睡著了。 以末學自己的體會, 也許是自己累生累世的業障、習氣比較重, 所以一開始要親近佛法,並不是那麼容易。 如果您也有類似的情況,可以先從最簡單的方法開始: 🪷 每天花一點點時間,念誦: 南無地藏王菩薩 可以每天念 1000 遍。 不管是在搭車的時候、走路的時候, 或是生活中有空檔的時候,都可以念。 也可以準備一個簡單的計數器,一邊念佛號,一邊計數。 ─────────── 因為大家日常生活中,都有忙碌的工作與事情要處理, 所以不一定要一次念完。 如果沒辦法一次念完,也沒有關係。 可以分段念、慢慢念 —— 🌸 搭車的時候念一點 🌸 走路的時候念一點 🌸 休息的時候念一點 🌸 有空就念幾句 重點不是一次念完多少, 而是每天願意持續親近地藏王菩薩, 讓這份善念一點一點累積起來。 其實 1000 遍不會很久。 只要每天持續一點點, 慢慢地,心會比較安定, 也會比較容易親近佛法、接受佛法的經典。 ─────────── 🙏 每天念完佛號之後,也可以做一個簡單的迴向。 如果家裡有供奉地藏王菩薩聖像, 可以在菩薩面前上一炷香,合掌迴向。 如果家裡沒有地藏王菩薩聖像,也沒有關係。 家裡如果有供奉其他佛菩薩聖像, 或是有佛堂、佛像、佛經,也都可以。 甚至經書裡面如果有佛菩薩的圖像, 也可以恭敬地面對經書裡的佛菩薩圖像,合掌迴向。 重點不是家裡一定要有什麼樣的形式, 而是我們的心要恭敬、要真誠 ✨ ─────────── 可以簡單地跟佛菩薩說: 「弟子 ○○○,今天念誦南無地藏王菩薩佛號 1000 遍, 願將這份功德,迴向給弟子累生累世的冤親債主, 也迴向給十方一切有緣眾生。 祈請諸佛菩薩慈悲加持, 願大家都能離苦得樂,早聞佛法。」 這樣誠心迴向即可。 如果當下不方便上香,也沒有關係。 只要念完之後,合掌在心中默默迴向,也是一樣可以的。 佛法很多時候,不是看形式多複雜, 而是看我們的心是不是真誠 🌸 ─────────── 每天願意念一點、迴向一點、善念累積一點, 時間久了,心也會慢慢安定下來。 這是末學自己的切身經驗。 如果您也覺得自己想接觸佛法, 卻一直讀不下去、念不下去、容易想睡,或是心靜不下來, 也可以試試看這個方法。 不用急,也不用給自己太大壓力。 每天一點點,持續下去,就會慢慢不一樣 ✨ ─────────── 💛 末學不知道這樣做最後能幫助多少人。 但末學想, 哪怕只有一個人, 因為這些圖文而對佛法產生一點點興趣, 或者在人生低潮時得到一點點力量, 那就很值得了。 末學不是什麼高僧大德, 也不敢說自己真正懂經。 只是把自己曾經受到的幫助, 用現在能做到的方式,再分享出去 🪷 ─────────── 明天開始,《地藏十輪經》白話圖文分享正式開始。 願這一份小小的心意,能帶給大家一點光。 願大家都能平安、安定,人生越來越圓滿。 南無地藏王菩薩 🙏 明天,我們就開始囉 🌸 ─────────── 📚 免費索取《地藏菩薩本願經》紙本經書 《地藏菩薩本願經》是地藏法門的基礎,淺而易懂,適合初次接觸的朋友。 跟著我們一邊聽《十輪經》故事,一邊在家讀本願經 🌸 私訊我們「我要索取地藏經」,將免費寄送精美紙本經書給您(含郵資) #地藏十輪經 #地藏菩薩 #前言 #地藏法門 #南無地藏王菩薩 #地藏菩薩本願經 #每日佛經 #佛教"
