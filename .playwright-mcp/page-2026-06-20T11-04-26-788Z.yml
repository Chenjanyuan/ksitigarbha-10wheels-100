                        - generic [ref=e1211]:
                          - generic [ref=e2346]: 🌸【地藏十輪經系列 · 第 20 篇 / 全 100 篇】
                          - generic [ref=e2351]: 地藏菩薩親口宣說大咒語! 山頂震動、天樂自鳴、寶花從天而降 — 序品第一圓滿!
                          - generic [ref=e2356]: 親愛的朋友, 早安 🙏
                          - generic [ref=e2361]: 連續 19 天 — 我們一起走過序品第一。
                          - generic [ref=e2364]: "今天 — 序品就要結束了。地藏菩薩會給我們最後的禮物: 一個大咒語!"
                          - generic [ref=e2369]: ───────────
                          - generic [ref=e2374]: "📖 經文原文:"
                          - generic [ref=e2379]: "「爾時, 地藏菩薩摩訶薩即從座起, 而白佛言: 大德世尊! 我當濟度此四洲渚世尊弟子, 一切苾芻及苾芻尼、鄔波索迦、鄔波斯迦, 令其皆得增長憶念、增長守護憶念、增長壽命、增長身體、增長無病、增長色力、增長名聞、增長資具、增長親友......所謂有名具足水火吉祥光明大記明咒總持章句。」"
                          - generic [ref=e2384]: ✨ 「四洲渚」(ㄓㄡ ㄓㄨˇ) = 四大部洲, 古印度世界觀的整個世界
                          - generic [ref=e2387]: ✨ 「苾芻」(ㄅㄧˋ ㄔㄨˊ) = 比丘 (出家男眾)
                          - generic [ref=e2390]: ✨ 「苾芻尼」= 比丘尼 (出家女眾)
                          - generic [ref=e2393]: ✨ 「鄔波索迦」(ㄨ ㄆㄛ ㄙㄨㄛˇ ㄐㄧㄚ) = 優婆塞 (在家男眾)
                          - generic [ref=e2396]: ✨ 「鄔波斯迦」= 優婆夷 (在家女眾)
                          - generic [ref=e2399]: ✨ 「咒」= 真言, 一種濃縮的法力
                          - generic [ref=e2404]: ───────────
                          - generic [ref=e2409]: "地藏菩薩從座位上站起來, 走到佛陀面前, 說:"
                          - generic [ref=e2414]: 「世尊! 我今天要做一件事 ——
                          - generic [ref=e2417]: 我要救度佛陀您所有的弟子們 ——
                          - generic [ref=e2420]: 比丘、比丘尼、男居士、女居士, 全部!」
                          - generic [ref=e2425]: 全場大眾豎起耳朵:「地藏菩薩要怎麼救?」
                          - generic [ref=e2430]: ───────────
                          - generic [ref=e2435]: "地藏菩薩繼續說:"
                          - generic [ref=e2438]: "「我會幫助他們:"
                          - generic [ref=e2441]: 💭 增長記憶力
                          - generic [ref=e2444]: 💪 增長身體健康
                          - generic [ref=e2447]: 🏥 增長無病
                          - generic [ref=e2450]: ✨ 增長氣色光彩
                          - generic [ref=e2453]: 📿 增長名聲
                          - generic [ref=e2456]: 🏠 增長生活資源
                          - generic [ref=e2459]: 👥 增長親友
                          - generic [ref=e2462]: 👨‍🏫 增長弟子
                          - generic [ref=e2465]: 📜 增長持戒
                          - generic [ref=e2468]: 📚 增長多聞 (聽聞佛法)
                          - generic [ref=e2473]: 💎 增長慧捨 (智慧布施)
                          - generic [ref=e2476]: 🧘 增長禪定
                          - generic [ref=e2479]: 😌 增長安忍
                          - generic [ref=e2482]: 🎯 增長方便善巧
                          - generic [ref=e2485]: 🌟 增長覺悟
                          - generic [ref=e2488]: 🛤️ 增長進入大乘正道
                          - generic [ref=e2491]: 💡 增長法明
                          - generic [ref=e2496]: 🌱 增長成熟有情
                          - generic [ref=e2499]: 💖 增長大慈大悲
                          - generic [ref=e2502]: ⚪ 增長一切善法」
                          - generic [ref=e2507]: 全場聽呆了 — 這, 這也太全面了吧!
                          - generic [ref=e2512]: ───────────
                          - generic [ref=e2517]: "地藏菩薩說:"
                          - generic [ref=e2520]: 「我用一個咒語, 來實現這所有的增長 ——
                          - generic [ref=e2523]: 這個咒語叫『具足水火吉祥光明大記明咒總持章句』。
                          - generic [ref=e2526]: 我從過去無量恆河沙等諸佛那裡, 親自學來的!」
                          - generic [ref=e2531]: 佛陀慈悲點頭:「好, 你說。」
                          - generic [ref=e2536]: 地藏菩薩開口, 宣說咒語 ——
                          - generic [ref=e2541]: 📿 「讖蒱讖蒱讖讖蒱阿迦舍讖蒱⋯⋯」
                          - generic [ref=e2544]: (咒語很長, 全部都是梵音的真言)
                          - generic [ref=e2549]: ───────────
                          - generic [ref=e2554]: 當地藏菩薩開始念誦的瞬間 ——
                          - generic [ref=e2559]: 🌋 整個佉羅帝耶山 — 普皆震動!
                          - generic [ref=e2562]: 🎵 天上的樂器 — 不鼓自鳴!
                          - generic [ref=e2565]: 🌸 天上下起無量種美麗的花!
                          - generic [ref=e2568]: 💎 還有各種珍寶, 從空中飄落!
                          - generic [ref=e2573]: 全場大眾驚嘆 ——
                          - generic [ref=e2576]: 「太殊勝了! 太驚奇了!」
                          - generic [ref=e2579]: 每個人都「得未曾有」 — 從來沒見過這樣的場面。
                          - generic [ref=e2584]: ───────────
                          - generic [ref=e2589]: 咒語念完, 大吉祥天女、具大吉祥天女、大池妙音天女、大堅固天女、具大水天女、放大光天女 — 6 位天女, 帶領 18000 位天女, 一起站起來。
                          - generic [ref=e2594]: "她們頂禮佛陀, 對佛陀說:"
                          - generic [ref=e2597]: 「世尊! 太希有了! 太奇妙了!
                          - generic [ref=e2600]: 我們雖然可以掌握地、水、火、風四大,
                          - generic [ref=e2603]: 但連我們都不知道, 這四大怎麼生、怎麼滅。
                          - generic [ref=e2606]: 地藏菩薩, 居然完全清楚!」
                          - generic [ref=e2611]: "佛陀微笑:"
                          - generic [ref=e2614]: 「對。地藏菩薩已經得到最微細最深的般若智慧, 能明白四大的真相。」
                          - generic [ref=e2619]: ───────────
                          - generic [ref=e2624]: "佛陀最後說了一個比喻:"
                          - generic [ref=e2629]: 「就像如意珠, 能下無量寶物給眾生;
                          - generic [ref=e2632]: 地藏菩薩, 就像活的如意珠 — 能下無量功德給眾生!」
                          - generic [ref=e2637]: 全場大眾合掌, 至心諦觀地藏菩薩, 目不暫舍 ——
                          - generic [ref=e2640]: 從那一刻起, 大眾的眼睛, 再也離不開這位偉大的菩薩。
                          - generic [ref=e2645]: 🌸 序品第一 — 圓滿! 🌸
                          - generic [ref=e2650]: ───────────
                          - generic [ref=e2655]: 明天 — 進入「十輪品第二」, 地藏菩薩會自己向佛陀請問:「請問世尊, 您怎麼成就十種佛輪?」一個全新的篇章開始!
                          - generic [ref=e2660]: ───────────
