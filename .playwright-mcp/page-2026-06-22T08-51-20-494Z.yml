                          - generic [ref=e1892]:
                            - generic [ref=e3949]: 🌸【地藏十輪經白話圖文連載 · 前言】
                            - generic [ref=e3954]: 明天開始,《地藏十輪經》白話圖文連載,正式開始 🙏
                            - generic [ref=e3959]: 末學想先寫一點心裡話,跟大家分享。
                            - generic [ref=e3964]: ───────────
                            - generic [ref=e3969]: 末學此生很有幸,能夠遇到地藏法門。
                            - generic [ref=e3974]: 在人生最低潮、最困難的時候,
                            - generic [ref=e3977]: 是地藏王菩薩的法門,也是佛法,
                            - generic [ref=e3980]: 慢慢扭轉了末學的人生。
                            - generic [ref=e3985]: 末學常常想 ——
                            - generic [ref=e3988]: 如果二十歲就能遇到佛法,
                            - generic [ref=e3991]: 也許人生會走得很不一樣。
                            - generic [ref=e3994]: 也許會少走很多冤枉路,也許會少受很多苦。
                            - generic [ref=e3999]: 但末學也不覺得可惜。
                            - generic [ref=e4004]: 人生的因緣,或許本來就有它的安排。
                            - generic [ref=e4007]: 該遇到的時候,就會遇到。
                            - generic [ref=e4012]: ───────────
                            - generic [ref=e4017]: 也因為自己曾經走過低潮,
                            - generic [ref=e4020]: 所以末學更希望,能夠把這一份因緣分享出去。
                            - generic [ref=e4025]: 末學的初衷很簡單 ——
                            - generic [ref=e4028]: 不是要大家死背佛經,也不是要把佛法講得很深奧。
                            - generic [ref=e4033]: 只是希望更多人可以因為接觸佛法,
                            - generic [ref=e4036]: 讓自己的人生過得更好一點、更安定一點、更圓滿一點 ✨
                            - generic [ref=e4041]: ───────────
                            - generic [ref=e4046]: 📖 之前末學曾經分享過《地藏菩薩本願經》的圖文內容。
                            - generic [ref=e4051]: 《地藏菩薩本願經》是地藏法門很重要、也很適合入門的一部經典,
                            - generic [ref=e4054]: 內容相對白話,許多人比較容易理解。
                            - generic [ref=e4059]: 末學也一直認為,地藏法門是很適合所有人學習的法門。
                            - generic [ref=e4064]: 所以到目前為止,我們也仍然持續提供《地藏菩薩本願經》這本經書,
                            - generic [ref=e4067]: 讓有需要、有因緣的朋友可以免費索取 🌸
                            - generic [ref=e4072]: 如果您想開始接觸地藏法門,
                            - generic [ref=e4075]: 末學會很建議先從《地藏菩薩本願經》開始。
                            - generic [ref=e4080]: ───────────
                            - generic [ref=e4085]: 🌸 另外也跟大家補充一下 ——
                            - generic [ref=e4090]: 我們原本 FB 的方向,是以《地藏菩薩本願經》為主,
                            - generic [ref=e4093]: 希望讓更多人可以接觸地藏法門,
                            - generic [ref=e4096]: 也持續提供《地藏菩薩本願經》讓有緣的朋友免費索取。
                            - generic [ref=e4101]: 後來末學慢慢覺得 ——
                            - generic [ref=e4104]: 地藏法門不只是《地藏菩薩本願經》而已,
                            - generic [ref=e4107]: 還包含《占察善惡業報經》與《地藏十輪經》等重要經典。
                            - generic [ref=e4112]: 所以我們也把 FB 的方向,
                            - generic [ref=e4115]: 從原本比較單一的《地藏菩薩本願經》分享,
                            - generic [ref=e4118]: 慢慢調整成 ——
                            - generic [ref=e4123]: 🌸【地藏菩薩 經典導讀】🌸
                            - generic [ref=e4128]: 希望未來可以用更白話、更容易親近的方式,
                            - generic [ref=e4131]: 慢慢陪大家一起認識地藏菩薩的經典與法門 ✨
                            - generic [ref=e4136]: ───────────
                            - generic [ref=e4141]: "📚 地藏三經:"
                            - generic [ref=e4146]: 1️⃣《地藏菩薩本願經》 — 入門經典,白話易懂
                            - generic [ref=e4149]: 2️⃣《占察善惡業報經》 — 末學也還不敢說真正懂了
                            - generic [ref=e4152]: 3️⃣《地藏十輪經》 — 這次要分享的
                            - generic [ref=e4157]: 所以這一次,末學想先從《地藏十輪經》開始。
                            - generic [ref=e4162]: ───────────
                            - generic [ref=e4167]: 其實《地藏十輪經》這本經書,
                            - generic [ref=e4170]: 大概七、八年前就已經來到末學家裡了。
                            - generic [ref=e4175]: 但它真的很厚。
                            - generic [ref=e4180]: 相信很多人看到這麼厚的經書,
                            - generic [ref=e4183]: 可能還沒開始讀,就已經先覺得有壓力了。
                            - generic [ref=e4188]: 包含末學自己也是。
                            - generic [ref=e4193]: 以前看到這麼厚一本,
                            - generic [ref=e4196]: 真的也很容易放著放著,就一直沒有翻開。
                            - generic [ref=e4201]: ───────────
                            - generic [ref=e4206]: 可是這幾年慢慢接觸佛法之後,
                            - generic [ref=e4209]: 末學越來越覺得 ——
                            - generic [ref=e4214]: 佛經真正重要的地方,不只是文字本身,
                            - generic [ref=e4217]: 而是它能不能落實在生活裡 ✨
                            - generic [ref=e4222]: 佛法不是拿來放在書櫃裡的。
                            - generic [ref=e4225]: 佛法是可以幫助我們面對人生、改善心念、調整行為,
                            - generic [ref=e4228]: 讓生活變得更好的。
                            - generic [ref=e4233]: 所以這一次,末學想盡自己的一點能力,
                            - generic [ref=e4236]: 用最白話、最容易理解的方式,
                            - generic [ref=e4239]: 把《地藏十輪經》的意思介紹給大家。
                            - generic [ref=e4244]: 不敢說是完整講經,也不敢說自己真正懂經。
                            - generic [ref=e4247]: 只是把經文裡面好的觀念,整理成比較容易閱讀的貼文,
                            - generic [ref=e4250]: 再搭配插圖,希望大家比較容易親近 🌸
                            - generic [ref=e4255]: 希望大人看得懂,小朋友也能看懂。
                            - generic [ref=e4258]: 也希望父母可以陪孩子一起看,
                            - generic [ref=e4261]: 讓孩子從小就能接觸善的觀念。
                            - generic [ref=e4266]: ───────────
                            - generic [ref=e4271]: 如果您覺得自己暫時還沒有辦法閱讀《地藏菩薩本願經》,
                            - generic [ref=e4274]: 也沒有關係。
                            - generic [ref=e4279]: 末學自己以前剛開始念《地藏菩薩本願經》的時候,
                            - generic [ref=e4282]: 也常常念沒多久就睡著了。
                            - generic [ref=e4287]: 以末學自己的體會,
                            - generic [ref=e4290]: 也許是自己累生累世的業障、習氣比較重,
