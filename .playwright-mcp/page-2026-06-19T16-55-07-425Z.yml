                        - generic [ref=e595]:
                          - generic [ref=e1567]: 🌸【地藏十輪經系列 · 第 3 篇 / 全 100 篇】
                          - generic [ref=e1570]: 四種雨下完後, 大眾的手心裡, 居然出現了會發光的珠子......
                          - generic [ref=e1577]: 親愛的朋友, 早安 🙏
                          - generic [ref=e1584]: 昨天我們看到了 — 南方天空, 飄來香雲、花雲、寶飾雲、衣服雲, 還下了 4 種雨。
                          - generic [ref=e1587]: 今天 — 大家會發現自己身上, 出現了奇怪又神奇的東西。
                          - generic [ref=e1594]: ───────────
                          - generic [ref=e1597]: "📖 經文原文:"
                          - generic [ref=e1600]: 「爾時, 一切諸來大眾, 鹹見如是種種雲雨, 亦聞如是諸法音聲, 隨意所樂, 各見其身種種香花、寶飾、衣服之所莊嚴。又各自見兩手掌中持如意珠, 從是一一如意珠中雨種種寶。」
                          - generic [ref=e1607]: ✨ 「鹹見」= 大家都看見
                          - generic [ref=e1610]: ✨ 「如意珠」(讀作 ㄖㄨˊ ㄧˋ ㄓㄨ) = 會實現願望的寶珠
                          - generic [ref=e1613]: ✨ 「兩手掌中」= 在手掌裡
                          - generic [ref=e1620]: ───────────
                          - generic [ref=e1623]: 雨停了, 大家還在仰望天空。
                          - generic [ref=e1626]: 突然, 一位苾芻低頭看自己 — 「啊!」
                          - generic [ref=e1629]: 他發現自己身上, 居然穿著一件好漂亮的香花做的衣服!
                          - generic [ref=e1632]: 胸前還有寶石做的飾品, 是剛剛從天上下來的禮物。
                          - generic [ref=e1639]: 「我也是!」「我也是!」
                          - generic [ref=e1642]: "所有人都低頭看自己 — 每個人都收到了不同的禮物:"
                          - generic [ref=e1645]: 🌸 有的人身上掛滿了香花
                          - generic [ref=e1648]: 💎 有的人戴著閃閃發光的寶飾
                          - generic [ref=e1651]: 👘 有的人穿上了柔軟的天衣
                          - generic [ref=e1658]: 奇怪的是 — 每個人收到的禮物都剛好是「自己喜歡的」!
                          - generic [ref=e1665]: 更神奇的事還在後面 ✨
                          - generic [ref=e1672]: 每個人攤開手掌看 — 兩手掌心居然各有一顆會發光的圓珠子!
                          - generic [ref=e1675]: 「這是......如意珠?」一位菩薩驚呼。
                          - generic [ref=e1682]: 如意珠像活的一樣, 在掌心微微旋轉。
                          - generic [ref=e1685]: 從珠子裡, 不停地飄出小寶物 — 珍珠、瑪瑙、寶石, 一個一個從珠子裡跳出來。
                          - generic [ref=e1692]: 但這還不夠神奇。每顆如意珠裡, 同時射出了光明! 🌟
                          - generic [ref=e1699]: 那光明照到生病的人, 病立刻好了 ——
                          - generic [ref=e1702]: 「奇怪, 我的咳嗽不見了!」
                          - generic [ref=e1705]: 「我的腳痛......也不痛了!」
                          - generic [ref=e1712]: 光明照到關在牢裡的人, 鎖鏈居然斷了, 人也被放出來了!
                          - generic [ref=e1715]: 光明照到挨餓的人, 肚子立刻就飽了。
                          - generic [ref=e1718]: 光明照到沒有衣服穿的人, 身上馬上就出現了一件衣服。
                          - generic [ref=e1721]: 光明照到憂愁的人, 心裡立刻變得平安歡喜。
                          - generic [ref=e1728]: ───────────
                          - generic [ref=e1731]: 就在這個奇蹟發生的時刻, 大眾突然發現一件事 ——
                          - generic [ref=e1734]: 全身像被某種力量壓住, 變得好重, 重到舉不起腳!
                          - generic [ref=e1737]: 「咦?我的身體變得好重......」
                          - generic [ref=e1740]: 「我也是, 像被綁住了。」
                          - generic [ref=e1747]: 不是壞事, 但很奇怪。
                          - generic [ref=e1750]: "所有人面面相覷, 心裡都在問:"
                          - generic [ref=e1753]: 「這到底是什麼徵兆?」「什麼人來了, 會這麼神奇?」
                          - generic [ref=e1760]: ───────────
                          - generic [ref=e1763]: 明天 — 一位天神, 會代表所有人, 問佛陀這到底是什麼回事。
                          - generic [ref=e1770]: ───────────
                          - generic [ref=e1773]: 💡 啟發反思
                          - generic [ref=e1780]: "聖嚴法師說: 「真正的禮物, 都是先讓你受感動, 然後才送到。」"
                          - generic [ref=e1787]: 香花、寶飾、衣服、如意珠 — 每個人收到的, 都剛好是自己最想要的。
                          - generic [ref=e1790]: 這不是巧合, 是慈悲的力量, 在了解我們的心。
                          - generic [ref=e1793]: 今天, 試試看 — 留意一下, 生活中是不是也有「剛好你需要」的禮物?
                          - generic [ref=e1796]: 那不是運氣, 是慈悲。
                          - generic [ref=e1803]: ───────────
                          - generic [ref=e1806]: 💡 明日預告
                          - generic [ref=e1809]: "第 4 篇 — 「天帝釋無垢生的提問」:"
                          - generic [ref=e1812]: 一位戴著光明天冠的天神, 從座位起身, 合掌恭敬地問佛陀:「世尊, 為什麼會出現這麼神奇的徵兆?」
