                      - generic [ref=e600]:
                        - generic [ref=e1755]: 🌸【地藏十輪經系列 · 第 5 篇 / 全 100 篇】
                        - generic [ref=e1758]: 佛陀終於開口了 — 「有一位菩薩, 名字叫地藏......」
                        - generic [ref=e1763]: 親愛的朋友, 早安 🙏
                        - generic [ref=e1768]: "昨天 — 天帝釋無垢生代表大家發問: 「這些徵兆, 到底是誰要來?」"
                        - generic [ref=e1771]: 全場大眾屏住呼吸, 等著佛陀的答案。
                        - generic [ref=e1776]: 今天 — 佛陀微微一笑, 終於說出了那個名字。
                        - generic [ref=e1781]: ───────────
                        - generic [ref=e1784]: "📖 經文原文:"
                        - generic [ref=e1789]: "「爾時, 世尊告無垢生天帝釋曰: 汝等當知, 有菩薩摩訶薩, 名曰地藏, 已於無量無數大劫, 五濁惡時, 無佛世界, 成熟有情。今與八十百千那庾多頻跋羅菩薩俱, 為欲來此禮敬、親近、供養我故......」"
                        - generic [ref=e1794]: ✨ 「告」(ㄍㄠˋ) = 對誰說話
                        - generic [ref=e1797]: ✨ 「無量無數大劫」= 數不清的非常非常久時間
                        - generic [ref=e1800]: ✨ 「五濁惡時」= 五種混濁的時代 (劫濁、見濁、煩惱濁、眾生濁、命濁)
                        - generic [ref=e1803]: ✨ 「無佛世界」= 沒有佛陀出世的世界
                        - generic [ref=e1806]: ✨ 「成熟有情」= 讓眾生的善根長大、成熟
                        - generic [ref=e1809]: ✨ 「那庾多」(ㄋㄚˋ ㄩˇ ㄉㄨㄛ) = 古印度大數字, 約等於億
                        - generic [ref=e1812]: ✨ 「頻跋羅」(ㄆㄧㄣˊ ㄅㄚˊ ㄌㄨㄛˊ) = 更大的數字
                        - generic [ref=e1817]: ───────────
                        - generic [ref=e1820]: "佛陀慢慢看向無垢生, 用溫柔的聲音說:"
                        - generic [ref=e1823]: 「你們都要知道 — 有一位大菩薩, 名字叫『地藏』。」
                        - generic [ref=e1828]: 全場大眾屏息 ——「地藏!」
                        - generic [ref=e1831]: 這個名字, 很多人從來沒聽過。
                        - generic [ref=e1836]: "佛陀繼續說:"
                        - generic [ref=e1839]: 「他在很久很久以前 — 久到我們連數字都數不完 — 就一直在做一件事。
                        - generic [ref=e1842]: 在那些沒有佛陀的世界裡, 在最壞、最亂、最苦的時代, 他從來沒有離開。」
                        - generic [ref=e1847]: ───────────
                        - generic [ref=e1850]: 「五濁惡時」是什麼?
                        - generic [ref=e1853]: 佛陀說的這個時代, 就像我們現在一樣 ——
                        - generic [ref=e1858]: "☁️ 劫濁: 時代很亂, 戰爭瘟疫不斷"
                        - generic [ref=e1861]: "☁️ 見濁: 大家想法偏差, 是非顛倒"
                        - generic [ref=e1864]: "☁️ 煩惱濁: 貪心瞋心癡心很重"
                        - generic [ref=e1867]: "☁️ 眾生濁: 人心冷漠, 互相傷害"
                        - generic [ref=e1870]: "☁️ 命濁: 壽命短, 災禍多"
                        - generic [ref=e1875]: 在這樣的時代, 連佛陀都沒有出世 —
                        - generic [ref=e1878]: 但地藏菩薩, 一個人, 默默地進去, 一個一個救。
                        - generic [ref=e1883]: ───────────
                        - generic [ref=e1886]: "佛陀又說:"
                        - generic [ref=e1889]: 「今天, 他來了 — 而且不是自己來。
                        - generic [ref=e1892]: 帶了八十百千那庾多頻跋羅位菩薩眷屬, 一起來。」
                        - generic [ref=e1897]: 「八十百千那庾多頻跋羅」是多少?
                        - generic [ref=e1900]: 連算數最厲害的人都算不出來 — 那是一個天文數字的軍團。
                        - generic [ref=e1905]: 全場一片驚嘆 ——「這麼多!」
                        - generic [ref=e1908]: "想像一下: 一座山頭, 突然要來幾億位菩薩, 那是什麼樣的場面?"
                        - generic [ref=e1913]: ───────────
                        - generic [ref=e1916]: "佛陀補了一句:"
                        - generic [ref=e1919]: 「他們來, 是為了 —」
                        - generic [ref=e1924]: 1. 禮敬我 🙏
                        - generic [ref=e1927]: 2. 親近我 (聽我說法) 📿
                        - generic [ref=e1930]: 3. 供養我 🌸
                        - generic [ref=e1933]: 4. 來看這場大法會, 心中歡喜隨喜 ✨
                        - generic [ref=e1938]: 全場大眾這才恍然大悟 ——
                        - generic [ref=e1941]: 「原來如此! 那些香雨花雨、如意珠、光明, 都是地藏菩薩快到了的徵兆!」
                        - generic [ref=e1946]: ───────────
                        - generic [ref=e1949]: 明天 — 佛陀會開始讚嘆地藏菩薩的功德, 像翻開一本厚厚的功德簿......
                        - generic [ref=e1954]: ───────────
                        - generic [ref=e1957]: 💡 啟發反思
                        - generic [ref=e1962]: "聖嚴法師說: 「最偉大的人, 往往在最沒有人看見的地方做事。」"
                        - generic [ref=e1967]: 地藏菩薩, 不是只在有佛陀的時候才出現。
                        - generic [ref=e1970]: 他選擇的, 都是「最難的地方」、「最苦的時代」、「最沒人去的角落」。
                        - generic [ref=e1975]: 今天 — 想想看, 我們身邊有沒有人, 默默地在做一些別人不想做的事?
                        - generic [ref=e1978]: 那, 就是地藏菩薩的影子。
                        - generic [ref=e1981]: 看見了, 就跟他說一聲謝謝。
                        - generic [ref=e1986]: ───────────
                        - generic [ref=e1989]: 💡 明日預告
                        - generic [ref=e1994]: "第 6 篇 — 「佛讚地藏之一 · 伏藏明珠」:"
                        - generic [ref=e1997]: 佛陀說:「這位大菩薩, 是諸多微妙功德的伏藏, 是諸解脫珍寶出處......」
                        - generic [ref=e2002]: ───────────
