                        - generic [ref=e485]: "🌸【地藏十輪經系列 · 第 18 篇 / 全 100 篇】 被火燒、被水淹、從山崖墜落、被毒蛇咬......最危險時, 地藏菩薩也會來救! 親愛的朋友, 早安 🙏 昨天 — 佛陀說地藏菩薩會救「基本生活」的苦。 今天 — 佛陀說地藏菩薩連「最危險的時刻」也會救! ─────────── 📖 經文原文: 「隨所在處, 若諸有情, 為火所焚, 為水所溺, 為風所飄, 或於山巖崖岸, 樹舍顛墜墮落, 其心周惶, 有能至心稱名、念誦、歸敬、供養地藏菩薩摩訶薩者, 一切皆得離諸危難, 安隱無損......」 ✨ 「焚」(ㄈㄣˊ) = 燒 ✨ 「溺」(ㄋㄧˋ) = 淹 ✨ 「飄」(ㄆㄧㄠ) = 被風吹走 ✨ 「顛墜」(ㄉㄧㄢ ㄓㄨㄟˋ) = 從高處摔下 ✨ 「周惶」(ㄓㄡ ㄏㄨㄤˊ) = 嚇得不知所措 ─────────── 佛陀接著說 —— 「人生有些時刻, 真的很可怕 — 火災、水災、強風、墜落...... 只要至心呼喚地藏菩薩, 都會脫險。」 全場聽得心驚膽戰 —— 「真的?」「我朋友前陣子才出車禍......」 佛陀點頭:「真的。我來一個一個說。」 ─────────── 🔥 第 1 種危難: 被火燒 「為火所焚」 — 火災! 房子起火、衣服著火、被火追逐...... 至心念「南無地藏菩薩」 —— 突然會有一條路, 讓你逃出去。 或是, 火會「莫名其妙」熄滅。 很多人都有這種經驗。 💧 第 2 種危難: 被水淹 「為水所溺」 — 水災、溺水! 洪水沖來、船翻了、小孩掉進水裡...... 至心念地藏菩薩 —— 會抓到一根浮木、會被人撈上來、會奇蹟生還。 ─────────── 💨 第 3 種危難: 被風吹走 「為風所飄」 — 颱風、龍捲風! 被大風吹得站不穩、屋頂飛走、東西亂飛...... 至心念地藏菩薩 —— 風會減弱、會找到避難所、會安全度過。 🏔️ 第 4 種危難: 從高處摔下 「於山巖崖岸, 樹舍顛墜墮落」 — 從山上、樹上、屋頂摔下! 至心念地藏菩薩 —— 會摔得輕、會被樹枝接住、會奇蹟般沒受傷。 很多登山者、工人都有這種經驗。 ─────────── 🐍 第 5 種危難: 毒蛇、毒蟲、中毒 佛陀說: 「為諸毒蛇毒蟲所螫, 或被種種毒藥所中 —— 至心念地藏菩薩, 一切皆得離諸惱害。」 被蛇咬、被毒蟲叮、誤食毒物 —— 念地藏菩薩, 毒會慢慢退、會遇到解藥、會撐到醫院。 🌡️ 第 6 種危難: 瘧疾發作 佛陀說 —— 「為惡鬼所持, 成諸瘧病, 或日日發, 或隔日發 —— 令狂亂, 身心顫掉, 迷悶失念, 無所了知。」 在古印度, 瘧疾是大病 — 發作起來高燒抖個不停, 整個人神志不清。 至心念地藏菩薩, 病情會穩定、會找到對的藥、會慢慢康復。 ─────────── 👹 第 7 種危難: 鬼神、惡獸、怨敵、戰爭 佛陀說 —— 「為諸藥叉、羅剎、餓鬼、畢舍遮鬼...... 及諸虎、狼、師子、惡獸、蠱毒、厭禱、諸惡咒術、怨賊、軍陣...... 之所纏繞, 身心慞惶, 懼失身命 ——」 白話: 遇到鬼、遇到惡獸、被仇人追、遇到戰爭, 嚇得要死 —— 「有能至心稱名、念誦、歸敬、供養地藏菩薩摩訶薩者, 一切皆得離諸怖畏, 保全身命。」 也就是 — 怕什麼? 念地藏菩薩, 全部不用怕。 恐懼會消失, 性命會保住。 ─────────── 佛陀講完, 全場大眾紛紛跪下: 「世尊! 我們現在就要學會這個方法! 」 佛陀微笑:「方法很簡單 — 就是『至心』。 心要真誠, 不能半信半疑。」 ─────────── 明天 — 佛陀會講地藏菩薩怎麼「變現各種身形」, 度化不同的眾生...... ─────────── 💡 啟發反思 聖嚴法師說: 「在最害怕的時候, 還能想起菩薩名字, 那就是修行的成績。」 平常念熟了, 緊急時才會自然冒出來。 如果平常不念, 真的遇到災難, 心一慌, 名字就忘了。 今天 — 養成一個小習慣: 每天早上一睜眼, 默念三聲「南無大願地藏王菩薩」。 晚上睡前, 再念三聲。 念久了, 真的有事時, 心會自動呼喚 — 救命的人就到了。 ─────────── 💡 明日預告 第 19 篇 — 「地藏現種種身度有情」: 佛陀說: 地藏菩薩會現大梵王身、自在天身、佛身、菩薩身, 甚至動物身、地獄卒身, 度化所有眾生...... ─────────── 📚 免費索取《地藏菩薩本願經》紙本經書 《地藏菩薩本願經》是地藏法門的基礎, 淺而易懂, 適合初次接觸的朋友。 跟著我們一邊聽《十輪經》故事, 一邊在家讀本願經, 慢慢建立對地藏菩薩的認識。 私訊我們「我要索取地藏經」, 將免費寄送精美紙本經書給您(含郵資)🌸 #地藏十輪經 #地藏菩薩 #第18篇 #危難救拔 #尋聲救苦 #地藏菩薩本願經 #每日佛經 #台灣佛教"
