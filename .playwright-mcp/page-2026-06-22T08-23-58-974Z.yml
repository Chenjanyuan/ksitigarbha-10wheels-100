                        - generic [ref=e863]: "🌸【地藏十輪經系列 · 第 11 篇 / 全 100 篇】 大眾感動到不行 — 紛紛把身上最好的東西, 全部獻給地藏菩薩...... 親愛的朋友, 早安 🙏 昨天 — 地藏菩薩說完禮讚佛偈, 全場掉淚。 今天 — 大眾從感動轉為行動。每個人都拿出最好的, 奉獻給地藏菩薩。 ─────────── 📖 經文原文: 「爾時, 一切諸來大眾, 既見地藏菩薩摩訶薩已, 皆獲希奇, 得未曾有, 各持種種上妙香花、寶飾、衣服、幢幡蓋等, 奉散地藏菩薩摩訶薩, 而為供養, 皆作是言: 我等今者快得善利, 因佛神力, 親得瞻仰、禮敬、供養如是大士。」 ✨ 「希奇」(ㄒㄧ ㄑㄧˊ) = 太難得了 ✨ 「未曾有」= 從來沒見過 ✨ 「奉散」= 恭敬地撒 ✨ 「瞻仰」(ㄓㄢ ㄧㄤˇ) = 抬頭恭敬地看 ✨ 「快得善利」= 太幸運得到大好處了 ─────────── 地藏菩薩的禮讚偈剛說完, 全場像被電到 —— 「太難得了!」「真的是親眼見到了!」 大家從來沒見過這樣的大菩薩 —— 願力這麼大、苦行這麼久、慈悲這麼深。 心裡只有一個念頭:「我要供養他!」 ─────────── 🌸 第一波奉獻 — 香花 先是天人開始 —— 從袖子裡、從衣服裡, 拿出各種美麗的花朵: 🌹 紅色蓮花、白色茉莉、金色曼陀羅花...... 全部撒向地藏菩薩! 花瓣像下雨一樣, 落滿地藏菩薩四周。 💎 第二波 — 寶飾 龍王、藥叉、健達縛接著 —— 從寶箱裡拿出最珍貴的寶物: 珍珠串、瑪瑙瓔珞、金銀手鐲...... 一個一個, 恭敬地獻給地藏菩薩。 👘 第三波 — 衣服 印度俗人 (穿紗麗、纏腰布的男女) 也來了 —— 他們拿出家裡最美的天衣、最柔軟的絲巾: 「請收下, 這是我們最好的!」 ─────────── 🎏 第四波 — 幢幡蓋 國王、貴族、富人開始 —— 舉著漂亮的「幢」(寫滿經文的長旗子)、 「幡」(飄揚的長條彩布)、 「蓋」(像傘一樣的華蓋), 一個一個獻上去。 整個山頂, 變成一座彩色的花海, 一座供養的山。 ─────────── 每個人, 一邊奉獻, 一邊心裡說: 「我們真是太幸運了 —— 因為佛陀的神力, 我們今天才能親眼見到、親手禮拜、親自供養 這位偉大的地藏菩薩!」 很多人邊獻邊掉眼淚 — 不是難過, 是太感動了。 地藏菩薩微笑接受, 用最溫柔的眼神看著每一個人, 像在說: 「我都收到了, 你們的心, 我都看見了。」 ─────────── 明天 — 一位叫「好疑問」的菩薩, 會代表大家, 問佛陀關於地藏的事...... ─────────── 💡 啟發反思 聖嚴法師說: 「供養, 不是給菩薩添東西, 是讓我們的心變柔軟。」 大眾供養地藏菩薩, 不是因為菩薩需要 — 菩薩什麼都不缺。 是因為我們需要 — 需要透過奉獻, 讓自己的心打開。 今天 — 試著為一個人 (家人、朋友、陌生人) 做一個「小供養」: 一杯水、一句問候、一個微笑。 那一刻, 你的心會變得柔軟、溫暖。 ─────────── 💡 明日預告 第 12 篇 — 「好疑問菩薩起問」: 從大眾中, 走出一位名叫「好疑問」的菩薩, 他問佛陀:「世尊! 這位善男子從何而來? 所居佛國去此遠近?」 ─────────── 📚 免費索取《地藏菩薩本願經》紙本經書 《地藏菩薩本願經》是地藏法門的基礎, 淺而易懂, 適合初次接觸的朋友。 跟著我們一邊聽《十輪經》故事, 一邊在家讀本願經, 慢慢建立對地藏菩薩的認識。 私訊我們「我要索取地藏經」, 將免費寄送精美紙本經書給您(含郵資)🌸 #地藏十輪經 #地藏菩薩 #第11篇 #大眾供養 #香花寶飾 #地藏菩薩本願經 #每日佛經 #台灣佛教"
