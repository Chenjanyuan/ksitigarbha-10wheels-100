                        - generic [ref=e539]: "🌸【地藏十輪經系列 · 第 17 篇 / 全 100 篇】 佛陀親口承諾 — 只要你誠心念地藏菩薩的名字, 飢渴、缺衣、生病, 都會被幫忙! 親愛的朋友, 早安 🙏 昨天 — 佛陀講完 23 種禪定。 今天 — 佛陀講最讓人感動的事: 任何眾生, 只要誠心呼喚地藏菩薩, 他一定會來! ─────────── 📖 經文原文: 「隨所在處, 若諸有情, 種種希求憂苦逼切, 有能至心稱名、念誦、歸敬、供養地藏菩薩摩訶薩者, 一切皆得如法所求, 離諸憂苦, 隨其所應, 安置生天涅槃之道。隨所在處, 若諸有情, 飢渴所逼......」 ✨ 「隨所在處」= 不管在哪裡 ✨ 「至心」(ㄓˋ ㄒㄧㄣ) = 全心全意, 沒有雜念 ✨ 「稱名」= 唸他的名字「南無地藏菩薩」 ✨ 「念誦」= 心裡默念或口中唱誦 ✨ 「歸敬」= 歸依、恭敬 ─────────── 佛陀說: 「不管在哪裡 — 山頂、地下、城市、鄉村、海上、空中...... 只要有眾生, 因為各種需求或憂苦, 能用『至心』(全心全意) 呼喚地藏菩薩 —— 他的願望, 一定會被滿足!」 全場大眾驚奇:「真的嗎? 不管什麼願望?」 佛陀點頭:「對。我來一個一個說。」 ─────────── 🌾 第 1 種苦: 飢渴 佛陀說 —— 「如果有眾生, 餓得受不了、渴得受不了 —— 只要至心稱名、念誦、歸敬、供養地藏菩薩, 飲食一定會充足, 不再挨餓口渴。」 這不是「靠菩薩變出來」, 而是 —— 地藏菩薩會用各種方式, 讓你遇到食物、遇到願意給你食物的人。 很多人都有這個經驗 — 走投無路時, 突然有人請吃飯。 那, 就是地藏菩薩的「尋聲救苦」。 ─────────── 👘 第 2 種苦: 缺衣服、缺資源 佛陀說 —— 「如果有眾生, 缺衣服、缺寶飾、缺醫藥、缺床被、缺生活用品 —— 只要至心呼喚地藏菩薩, 所有需要的東西, 都會慢慢得到。」 想想看, 很多人沒有錢買冬衣, 突然朋友送了一件 — 很多人沒錢看病, 突然遇到義診 — 那, 都是地藏菩薩在幫忙。 ─────────── 💔 第 3 種苦: 愛別離、怨憎會 佛陀說 —— 「如果有眾生, 跟最愛的人分離了 (愛別離), 或被討厭的人糾纏 (怨憎會) —— 只要至心呼喚地藏菩薩, 愛的人會重逢, 討厭的人會遠離。」 這是人生最痛的兩種苦: 想在一起的人不能在一起, 不想在一起的人天天黏在一起。 地藏菩薩, 連這個都管。 🤒 第 4 種苦: 身心憂苦、眾病所惱 佛陀說 —— 「如果有眾生, 身心憂愁、被各種病折磨 —— 只要至心呼喚地藏菩薩, 身體會慢慢安穩, 病會慢慢好。」 很多病, 西醫看不好、中醫看不好 — 但心一靜下來, 病就好了。 地藏菩薩給的, 就是那份「心的力量」。 ─────────── 😡 第 5 種苦: 互相鬥爭、不和睦 佛陀說 —— 「如果有眾生, 跟人吵架、互相怨恨、鬥爭不休 —— 只要至心呼喚地藏菩薩, 毒害心會放下, 重新和好, 互相慈愛。」 家裡夫妻吵架、辦公室同事不合、兄弟反目...... 念地藏菩薩, 真的有用 — 不是菩薩變魔法, 是你的心先軟, 對方就跟著軟。 😩 第 6 種苦: 疲倦、氣力羸惙 佛陀說 —— 「如果有眾生, 身心累得不行, 沒力氣 —— 只要至心呼喚地藏菩薩, 立刻會身心暢適, 力氣強盛。」 上班族、家庭主婦、學生 — 累到不行的時候, 不要急著喝咖啡。 先在心裡默念三聲「南無地藏菩薩」, 慢慢呼吸。 那份疲倦, 會被一股清涼的力量沖掉。 ─────────── 明天 — 佛陀會講「尋聲救苦 · 危難救拔」, 那些更可怕的場景 — 火、水、墜落、毒蛇、惡鬼...... ─────────── 💡 啟發反思 聖嚴法師說: 「呼喚菩薩, 不是求菩薩來找你 — 是讓你的心, 走向菩薩。」 地藏菩薩永遠在那裡, 不需要召喚。 我們念他的名字, 是讓自己的心, 安住在「有人在守護我」的感覺裡。 那份感覺, 就是救苦的開始。 今天 — 試一次: 安靜地, 在心裡念三聲「南無大願地藏王菩薩」。 感受一下, 心會慢慢安靜下來。 那, 就是地藏菩薩的回應。 ─────────── 💡 明日預告 第 18 篇 — 「尋聲救苦 · 危難救拔」: 佛陀繼續說 — 被火燒、被水淹、被風吹、從山崖墜落、被毒蛇咬......只要至心呼喚地藏菩薩, 都能脫離危難。 ─────────── 📚 免費索取《地藏菩薩本願經》紙本經書 《地藏菩薩本願經》是地藏法門的基礎, 淺而易懂, 適合初次接觸的朋友。 跟著我們一邊聽《十輪經》故事, 一邊在家讀本願經, 慢慢建立對地藏菩薩的認識。 私訊我們「我要索取地藏經」, 將免費寄送精美紙本經書給您(含郵資)🌸 #地藏十輪經 #地藏菩薩 #第17篇 #尋聲救苦 #至心稱名 #地藏菩薩本願經 #每日佛經 #台灣佛教"
