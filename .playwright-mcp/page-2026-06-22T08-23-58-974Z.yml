                      - generic [ref=e430]:
                        - generic [ref=e431]: "🌸【地藏十輪經系列 · 第 19 篇 / 全 100 篇】 地藏菩薩會變成各種身分! 國王、商人、農夫, 甚至動物、鬼神 — 為了救度眾生! 親愛的朋友, 早安 🙏 昨天 — 佛陀講地藏菩薩怎麼救人於危難。 今天 — 佛陀講地藏菩薩怎麼「變身」 — 變成各種樣子, 進入不同眾生的世界。 ─────────── 📖 經文原文: 「為欲成熟諸有情故, 於十方界, 或時現作大梵王身, 為諸有情如應說法。或復現作大自在天身、或作欲界他化自在天身、或作樂變化天身......或作佛身, 或作菩薩身, 或作獨覺身, 或作聲聞身, 或作轉輪王身, 或作剎帝利身, 或作婆羅門身......」 ✨ 「現作」(ㄒㄧㄢˋ ㄗㄨㄛˋ) = 變現成、變身成 ✨ 「梵王」= 大梵天王, 天界的領袖之一 ✨ 「轉輪王」= 統治整個世界的聖王 ✨ 「剎帝利」(ㄔㄚˋ ㄉㄧˋ ㄌㄧˋ) = 印度貴族 / 武士階級 ✨ 「婆羅門」(ㄆㄛˊ ㄌㄨㄛˊ ㄇㄣˊ) = 印度祭司階級 ─────────── 佛陀說: 「地藏菩薩, 為了救度不同的眾生, 會變現成各種不同的身分。 」 全場大眾驚奇:「變身?」 佛陀微笑:「對, 而且變得超多種, 我們一個一個看。」 ─────────── ☁️ 第一類: 變成天神 「現作大梵王身、大自在天身、他化自在天身、樂變化天身、睹史多天身、夜摩天身、帝釋天身、四大王天身......」 白話講 —— 在天上, 地藏菩薩會變成各種天神, 為天神說法。 因為天神福報很大, 不容易聽佛法 — 所以菩薩變成「同伴」, 慢慢引導。 想想看 — 同學在打電動的時候, 你跟他講「不要打電動了」, 他會聽嗎? 但如果你跟他一起打, 一邊打一邊聊, 他才聽得進去。 地藏菩薩, 就是這樣對待天神的。 ─────────── 🙏 第二類: 變成佛、菩薩、阿羅漢 「或作佛身, 或作菩薩身, 或作獨覺身, 或作聲聞身......」 什麼? 地藏菩薩會變成佛? 對! 在某些世界, 沒有佛 — 他就變成佛陀的樣子, 教大家佛法。 在某些世界, 大家只信獨覺、阿羅漢 — 他就變成阿羅漢的樣子, 給大家信。 地藏菩薩不在乎「自己是什麼樣子」, 只在乎「眾生接受什麼樣子」。 👑 第三類: 變成國王、貴族、平民 「或作轉輪王身, 或作剎帝利身, 或作婆羅門身, 或作筏舍身, 或作戍達羅身, 或作丈夫身, 或作婦女身, 或作童男身, 或作童女身......」 白話 —— 在人間, 地藏菩薩會變成: 👑 國王 (轉輪王) ⚔️ 貴族武士 (剎帝利) 📿 祭司學者 (婆羅門) 💰 商人 (筏舍 ㄈㄚˊ ㄕㄜˋ) 🔨 工人農夫 (戍達羅 ㄕㄨˋ ㄉㄚˊ ㄌㄨㄛˊ) 👨 普通男人 👩 普通婦女 👦 小男孩 👧 小女孩 想想看 — 你身邊有沒有「特別貼心的陌生人」、「奇怪剛好出現的善心人」? 那可能就是地藏菩薩變的! ─────────── 🐉 第四類: 變成天龍鬼神 「或作健達縛身、阿素洛身、緊捺洛身、莫呼洛伽身、龍身、藥叉身、羅剎身、鳩畔荼身、畢舍遮身、餓鬼身......」 在鬼神的世界, 地藏菩薩會變成: 🎵 健達縛 (天上的樂神) ⚔️ 阿修羅 (戰鬥的鬼神) 🐍 龍王 💀 各種鬼類 用「同類人」的身分, 引導鬼神斷惡向善。 🦁 第五類: 變成動物 「或作師子身、香象身、馬身、牛身、或作種種禽獸之身......」 沒錯, 地藏菩薩會變成: 🦁 獅子 🐘 大象 🐎 馬 🐄 牛 🐦 各種飛禽走獸 為什麼? 因為動物世界也有眾生 — 動物也需要救度。 地藏菩薩變成動物群裡的「領袖」, 帶大家走向善處。 ─────────── 😱 第六類: 連地獄裡都去! 「或作剡魔王身, 或作地獄卒身, 或作地獄諸有情身......」 最不可思議的 —— 地藏菩薩會變成: 💀 閻羅王 (掌管地獄) 🔥 地獄獄卒 😖 地獄受苦的眾生 為什麼? 因為地獄裡的眾生, 一般沒人去救。 地藏菩薩變成獄卒, 站在你身邊; 變成受苦的同類, 跟你一起承擔。 然後找機會, 告訴你佛法, 帶你出去。 ─────────── 佛陀說完, 全場震驚: 「世尊! 地藏菩薩, 連地獄裡都進去! 真是大菩薩!」 佛陀微笑:「他發過願 — 地獄不空, 誓不成佛。」 ─────────── 明天 — 序品快要結束了! 地藏菩薩會親自說一個「大記明咒」, 送給佛陀做最後的禮物...... ─────────── 💡 啟發反思 聖嚴法師說: 「願意變成跟對方一樣的人, 才能真正幫到對方。」 地藏菩薩變成國王、商人、農夫、動物、甚至地獄獄卒 —— 不是要表演, 是要「跟對方平等」, 才能傳遞慈悲。 今天 — 對你身邊的人, 試著「站在他的位置」想一想: 他在乎什麼? 他怕什麼? 他需要什麼? 當你站在他那邊, 你就跟地藏菩薩一樣 — 慈悲了。 ─────────── 💡 明日預告 第 20 篇 — 「大記明咒 + 序品終」: 地藏菩薩親自宣說「具足水火吉祥光明大記明咒」, 然後序品第一就結束了! ─────────── 📚 免費索取《地藏菩薩本願經》紙本經書 《地藏菩薩本願經》是地藏法門的基礎, 淺而易懂, 適合初次接觸的朋友。 跟著我們一邊聽《十輪經》故事, 一邊在家讀本願經, 慢慢建立對地藏菩薩的認識。 私訊我們「我要索取地藏經」, 將免費寄送精美紙本經書給您(含郵資)🌸 #地藏十輪經 #地藏菩薩 #第19篇 #現種種身 #度化眾生 #地藏菩薩本願經 #每日佛經 #台灣佛教"
