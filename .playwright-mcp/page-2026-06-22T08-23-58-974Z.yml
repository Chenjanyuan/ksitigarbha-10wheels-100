                        - generic [ref=e809]: "🌸【地藏十輪經系列 · 第 12 篇 / 全 100 篇】 一位名叫「好疑問」的菩薩起身了 — 他要代替大家, 問清楚地藏菩薩的故事! 親愛的朋友, 早安 🙏 昨天 — 大家供養完地藏菩薩, 心中還有好多問號。 今天 — 一位叫「好疑問」的菩薩, 起身了。他要把大家心裡的問題, 全部問出來。 ─────────── 📖 經文原文: 「爾時, 眾中有菩薩摩訶薩, 名好疑問, 從座而起, 整理衣服, 偏袒一肩, 禮佛雙足, 右膝著地, 合掌向佛, 而白佛言: 世尊! 此善男子從何而來? 所居佛國去此遠近? 成就何等功德善根, 而蒙世尊種種稱嘆? 復能贊佛不可思議功德法海? 我等昔來未曾聞見, 唯願為說。」 ✨ 「好疑問」(ㄏㄠˋ ㄧˊ ㄨㄣˋ) = 菩薩的名字, 意思是「喜歡發問」 ✨ 「偏袒一肩」= 露出右肩, 印度恭敬的禮節 ✨ 「右膝著地」= 右膝跪在地上, 半跪 ✨ 「不可思議」= 想都想不到的不平凡 ─────────── 在剛剛熱鬧的供養儀式之後, 全場慢慢安靜下來。 大家心裡都有問題, 但不知道怎麼問。 突然, 從大眾中, 一位菩薩站起來 —— 他, 就是「好疑問菩薩」! 這位菩薩的名字, 就是「喜歡發問」 — 他從小就愛問問題。 佛陀講法的時候, 他常常代表大眾發問, 讓大家聽得更明白。 ─────────── 好疑問菩薩先整理一下衣服 —— 按照印度最恭敬的禮節, 把右肩露出來 (偏袒一肩)。 然後雙手合十, 慢慢向佛陀走過去。 走到佛陀面前, 他先頂禮佛陀的雙腳。 接著, 右膝跪在地上 (右膝著地), 左膝半立。 全場屏息, 看著他要問什麼。 ─────────── 好疑問菩薩合掌, 開口問佛陀: 「世尊! 我有幾個問題, 想請您幫我解答 ——」 ❓ 問題一: 「此善男子從何而來?」 翻譯: 「這位地藏菩薩, 他是從哪裡來的?」 全場點頭: 「對啊, 我也想知道!」 ❓ 問題二: 「所居佛國去此遠近?」 翻譯: 「他住在哪個佛國? 離我們這裡, 是遠還是近?」 全場再點頭: 「對啊, 那麼厲害, 是哪裡來的?」 ─────────── ❓ 問題三: 「成就何等功德善根, 而蒙世尊種種稱嘆?」 翻譯: 「他到底修了什麼功德、什麼善根, 才能讓世尊您, 一直一直讚嘆他?」 想想看 — 佛陀讚嘆一個人, 已經很厲害了; 佛陀「種種稱嘆」一個人, 那是極致的讚美。 ❓ 問題四: 「復能贊佛不可思議功德法海?」 翻譯: 「為什麼這位菩薩, 反過來能用那麼美的詩偈, 讚嘆佛陀那麼深的功德?」 這個問題很深 —— 通常是「佛讚嘆菩薩」, 很少有菩薩可以「讚嘆佛陀」到這麼準確。 地藏菩薩, 為什麼可以? ─────────── 好疑問菩薩說完, 加了一句: 「我等昔來未曾聞見 — 唯願為說。」 翻譯: 「我們從來沒聽過、見過這麼厲害的菩薩。世尊, 請您一定要告訴我們!」 全場大眾跟著合掌, 異口同聲: 「請世尊為我們解說!」 佛陀微笑點頭 —— 「好, 我來說。但有一個條件 — 你們要安靜聽, 一字一句不能漏。」 ─────────── 明天 — 佛陀會說, 地藏菩薩已經安住一種非常深、非常厲害的禪定, 叫「首楞伽摩三摩地」...... ─────────── 💡 啟發反思 聖嚴法師說: 「不會問問題的人, 也不會找到答案。」 好疑問菩薩, 就是因為「喜歡問」, 才能幫整個大眾打開智慧的大門。 如果他不問, 大家心裡的問號, 永遠是問號。 今天 — 心裡有什麼疑問? 不要憋著。 找朋友問、找老師問、找佛菩薩問 (在心裡默問也算)。 問了, 答案才會來。 ─────────── 💡 明日預告 第 13 篇 — 「地藏首楞伽摩三摩地」: 佛陀說:「這位大菩薩已經安住一種最深的禪定 — 首楞伽摩勝三摩地......」這是什麼樣的禪定? ─────────── 📚 免費索取《地藏菩薩本願經》紙本經書 《地藏菩薩本願經》是地藏法門的基礎, 淺而易懂, 適合初次接觸的朋友。 跟著我們一邊聽《十輪經》故事, 一邊在家讀本願經, 慢慢建立對地藏菩薩的認識。 私訊我們「我要索取地藏經」, 將免費寄送精美紙本經書給您(含郵資)🌸 #地藏十輪經 #地藏菩薩 #第12篇 #好疑問菩薩 #起問 #地藏菩薩本願經 #每日佛經 #台灣佛教"
