                        - generic [ref=e755]: "🌸【地藏十輪經系列 · 第 13 篇 / 全 100 篇】 佛陀說 — 地藏菩薩安住的禪定, 是最厲害的「首楞伽摩」三摩地! 親愛的朋友, 早安 🙏 昨天 — 好疑問菩薩問佛陀:「這位地藏菩薩到底有多厲害?」 今天 — 佛陀開始回答, 第一句就讓全場震驚。 ─────────── 📖 經文原文: 「佛言: 諦聽, 善思念之! 吾當為汝略說少分。如是大士, 成就無量不可思議殊勝功德, 已能安住首楞伽摩勝三摩地, 善能悟入如來境界; 已得最勝無生法忍, 於諸佛法已得自在; 已能堪忍一切智位; 已能超度一切智海......」 ✨ 「諦聽」(ㄉㄧˋ ㄊㄧㄥ) = 仔細地聽 ✨ 「三摩地」(ㄙㄢ ㄇㄛˊ ㄉㄧˋ) = 一種非常深的禪定, 心完全安住 ✨ 「首楞伽摩」(ㄕㄡˇ ㄌㄥˊ ㄑㄧㄝˊ ㄇㄛˊ) = 「健行」的意思, 像勇士一樣堅固勇猛的禪定 ✨ 「無生法忍」= 真正明白「萬法不生不滅」的智慧 ─────────── 佛陀慢慢開口: 「諦聽! 善思念之! — 你們要仔細聽, 認真想。」 全場屏息, 連呼吸都放輕了。 「這位大菩薩, 」佛陀說, 「他成就的功德, 沒辦法算、想不到、說不完。 我今天只給你們講一點點、一小部分。」 全場心想:「光是一點點, 就已經這麼多了!」 ─────────── 佛陀接著說 —— 💎 第一個讚嘆: 「已能安住首楞伽摩勝三摩地」 翻譯: 「他已經能安住在『首楞伽摩』這種最厲害的禪定中。」 什麼是「首楞伽摩」? 「首楞伽摩」= 健行三摩地, 意思是「像勇士一樣堅固勇猛」的禪定。 普通人打坐, 念頭一直跑, 五分鐘就坐不住。 地藏菩薩進入這個禪定 —— 心像金剛山一樣穩, 任何境界都動搖不了他。 再大的災難、再強的誘惑, 他的心都不會晃。 ─────────── 💎 第二個讚嘆: 「善能悟入如來境界」 翻譯: 「他能真正進入佛陀的境界。」 「如來境界」是什麼? 那是佛陀的「家」 — 清淨、平等、智慧、慈悲, 全部圓滿。 一般的菩薩, 只能「遠遠看」如來境界; 地藏菩薩, 可以「住進去」。 💎 第三個讚嘆: 「已得最勝無生法忍」 翻譯: 「他已經得到最高的『無生法忍』。」 什麼是「無生法忍」? 我們眾生看世界 — 一切都在生、在死。 花開花謝、人生人死, 我們都覺得「真的有生、有死」。 但其實, 「生死只是表面」 —— 真實的本性, 是「不生不滅」的。 地藏菩薩看到這個真相, 而且「穩穩接受」, 這就是「無生法忍」。 ─────────── 💎 第四個讚嘆: 「於諸佛法已得自在」 翻譯: 「在所有佛法上, 他已經完全自由自在。」 佛法那麼多 — 三藏十二部, 一輩子讀不完。 地藏菩薩, 不只讀完, 還可以「自在運用」 —— 哪個眾生需要哪一法, 他立刻拿出來, 不用查書。 💎 第五個讚嘆: 「已能堪忍一切智位」 翻譯: 「他已經能承擔一切智的位階。」 「一切智」是佛陀最高的智慧。 地藏菩薩已經可以「承擔」 — 也就是說, 他離成佛, 只差最後一步。 💎 第六個讚嘆: 「已能超度一切智海」 翻譯: 「他已經能超越、度過一切智的大海。」 佛陀的智慧, 像深不見底的大海。 地藏菩薩, 已經渡過去了。 ─────────── 佛陀說完這六句, 全場大眾再度震驚 —— 「世尊, 您講的是地藏菩薩, 還是您自己?」 佛陀微笑搖頭:「我說的, 是他。」 ─────────── 明天 — 佛陀會繼續說, 地藏菩薩安住的 23 種三摩地 (上半段)...... ─────────── 💡 啟發反思 聖嚴法師說: 「真正的穩, 不是不動 — 是不管怎麼動, 都不會倒。」 首楞伽摩, 是「勇士的禪定」 — 不是躲起來的禪定, 是面對風雨還能站穩的禪定。 我們不用一下就達到, 但可以一點一點練。 今天 — 練習一個小「健行」: 當你遇到一件煩心的事, 深呼吸三次, 告訴自己「我穩住」。 那一刻, 你就在練地藏菩薩的禪定。 ─────────── 💡 明日預告 第 14 篇 — 「二十三種三摩地 · 上」: 佛陀說地藏菩薩還安住了 23 種特別的禪定, 每一種都能利益不同的眾生。今天先講 8 種...... ─────────── 📚 免費索取《地藏菩薩本願經》紙本經書 《地藏菩薩本願經》是地藏法門的基礎, 淺而易懂, 適合初次接觸的朋友。 跟著我們一邊聽《十輪經》故事, 一邊在家讀本願經, 慢慢建立對地藏菩薩的認識。 私訊我們「我要索取地藏經」, 將免費寄送精美紙本經書給您(含郵資)🌸 #地藏十輪經 #地藏菩薩 #第13篇 #首楞伽摩 #禪定 #地藏菩薩本願經 #每日佛經 #台灣佛教"
