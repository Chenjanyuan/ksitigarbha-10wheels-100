                        - generic [ref=e593]: "🌸【地藏十輪經系列 · 第 16 篇 / 全 100 篇】 地藏菩薩 23 種禪定講完了! 最後這 7 種, 每一種都讓世界更美好...... 親愛的朋友, 早安 🙏 昨天 — 佛陀講了中間 8 種地藏菩薩的禪定。 今天 — 講最後 7 種, 講完今天 — 23 種就全部講完了! ─────────── 📖 經文原文: 「隨住如是諸佛國土, 若入能引勝踴躍定, 由此定力, 令彼佛土一切有情, 皆受無量勝妙歡喜。隨住如是諸佛國土, 若入具足世路光定, 由此定力, 令彼佛土一切有情, 得無礙智, 能修種種清淨事業......」 ✨ 「踴躍」(ㄩㄥˇ ㄩㄝˋ) = 開心到跳起來 ✨ 「世路」= 世間生活的道路 ✨ 「無礙智」= 沒有障礙的智慧 ✨ 「增上觀」= 更深入的觀察 ─────────── 🌟 第 17 種: 「能引勝踴躍定」 進入這個禪定 —— 那個世界的眾生, 心裡突然湧出「無量殊勝歡喜」! 不是表面的笑, 是從心底深處冒出來的喜悅。 像小孩第一次看見大海, 那種純真的歡喜。 地藏菩薩, 把這份歡喜給每一個眾生。 ─────────── 🌟 第 18 種: 「具足世路光定」 進入這個禪定 —— 那個世界的眾生, 得到「無礙智」, 能「修種種清淨事業」。 白話講 —— 做事再也不卡關, 心裡再也不糾結。 做的每件事, 都是好事、淨事、利益人的事。 🌟 第 19 種: 「善住勝金剛定」 進入這個禪定 —— 那個世界的眾生, 「諸根具足無缺」, 心裡寂靜安樂。 眼睛看得清、耳朵聽得到、手腳健全 — 身體圓滿。 心裡也安靜 — 不躁、不亂、不煩。 這, 就是金剛般堅固的福報。 ─────────── 🌟 第 20 種: 「增上觀勝幢定」 進入這個禪定 —— 那個世界的眾生, 會「深呵厭自惡業過」 —— 也就是: 深深地懺悔自己過去做過的壞事, 開始護持十善業道。 ❌ 不再殺生 ❌ 不再偷盜 ❌ 不再說謊 ✅ 開始放生 ✅ 開始布施 ✅ 開始說真話 這個世界, 變成「善的世界」。 🌟 第 21 種: 「具足慈悲聲定」 進入這個禪定 —— 那個世界的眾生, 全部「發起慈心、悲心」 —— 沒有怨害、平等相待、互相利益安樂。 沒有人想害別人; 沒有人想欺負別人; 大家都想「我能為你做什麼」。 那個世界, 就是淨土。 ─────────── 🌟 第 22 種: 「引集諸福德定」 進入這個禪定 —— 那個世界 —— ❌ 鬥爭沒了 ❌ 疾疫沒了 ❌ 饑荒沒了 ❌ 不合季的風雨沒了 ❌ 苦澀辛酸味、惡色觸 — 通通消失 換句話說 — 那個世界, 變成天堂! 地藏菩薩的禪定, 真的可以把人間變天堂。 🌟 第 23 種: 「海電光定」 進入這個禪定 —— 那個世界的「一切大地, 眾寶合成」! 所有的山、樹、花、果, 全部變成寶物 —— 🌳 寶樹、衣樹、器樹、瓔珞樹、花樹、果樹 🎵 還有會發出美妙音樂的「音樂樹」! 整個世界, 處處是寶, 處處是樂。 那個世界, 比天上的極樂世界, 更莊嚴! ─────────── 佛陀講完 23 種, 看著大家: 「這位地藏菩薩 — 每一個早晨, 都會進入殑伽沙等諸定 (像恆河沙一樣多的禪定)。 從定起來後, 就到十方諸佛國土, 成熟所有眾生, 利益安樂他們。」 全場感動不已 —— 「世尊! 我們今天早上起來, 是不是也被地藏菩薩照顧過?」 佛陀微笑:「對, 而且不只今天。」 ─────────── 明天 — 佛陀會講地藏菩薩怎麼「尋聲救苦」 — 任何眾生只要至心稱念地藏菩薩的名字, 就會得到救度...... ─────────── 💡 啟發反思 聖嚴法師說: 「禪定不是離世, 是入世更深。」 地藏菩薩的 23 種禪定, 沒有一種是「自己關起來爽」 —— 每一種都是「進入禪定, 然後讓眾生受益」。 今天 — 把你今天最安靜的 5 分鐘, 獻給一個人。 安靜地祝福他 — 願他平安、健康、快樂。 那 5 分鐘, 就是你的「小三摩地」, 對方真的會感受到。 ─────────── 💡 明日預告 第 17 篇 — 「尋聲救苦 · 基本生活」: 佛陀說: 任何眾生只要至心稱念、念誦、歸敬、供養地藏菩薩, 都能得到所求 — 飢餓得飲食、缺衣得衣服...... ─────────── 📚 免費索取《地藏菩薩本願經》紙本經書 《地藏菩薩本願經》是地藏法門的基礎, 淺而易懂, 適合初次接觸的朋友。 跟著我們一邊聽《十輪經》故事, 一邊在家讀本願經, 慢慢建立對地藏菩薩的認識。 私訊我們「我要索取地藏經」, 將免費寄送精美紙本經書給您(含郵資)🌸 #地藏十輪經 #地藏菩薩 #第16篇 #二十三三摩地 #禪定下 #地藏菩薩本願經 #每日佛經 #台灣佛教"
