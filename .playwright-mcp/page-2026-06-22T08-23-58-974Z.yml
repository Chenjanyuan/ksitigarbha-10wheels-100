                        - generic [ref=e917]: "🌸【地藏十輪經系列 · 第 10 篇 / 全 100 篇】 地藏菩薩接著說:「我的願力 — 是要在這個壞時代, 救最難救的眾生!」 親愛的朋友, 早安 🙏 昨天 — 地藏菩薩讚嘆佛陀:「慈心如天空, 安忍如大地。」 今天 — 他繼續說。但這次, 講的是自己的本願 (心裡發過的誓言)。 ─────────── 📖 經文原文: 「本願攝穢土, 成熟惡眾生。起堅固正勤, 久修諸苦行。曾供事無量, 佛菩薩聲聞, 及濟諸有情, 飢渴病死等。本為他有情, 自舍多身命; 本為正法故, 舍多骨血皮。棄捨自安樂, 悲愍諸有情。」 ✨ 「本願」= 從一開始發的願 (誓言) ✨ 「穢土」(ㄏㄨㄟˋ ㄊㄨˇ) = 又髒又亂的世界 (例如我們地球) ✨ 「正勤」= 努力, 精進 ✨ 「苦行」= 為了修行, 受很多苦 ✨ 「悲愍」(ㄅㄟ ㄇㄧㄣˇ) = 慈悲憐憫 ─────────── 地藏菩薩繼續說 —— 🌸 第七句: 「本願攝穢土, 成熟惡眾生」 翻譯: 「我的本願就是 — 不要清淨的世界, 我要去最髒、最亂的世界, 把最難救的眾生救出來。」 全場震驚 —— 「其他菩薩都選好的世界, 您卻選最壞的?」 地藏菩薩點頭:「對, 就是因為那裡最需要。」 ─────────── 🌸 第八句: 「起堅固正勤, 久修諸苦行」 翻譯: 「我發起最堅固的精進心, 已經修了非常非常久的苦行。」 「苦行」不是折磨自己, 是「為了眾生願意吃苦」。 地藏菩薩說: 「我一直在做, 從來沒有停過。」 🌸 第九句: 「曾供事無量, 佛菩薩聲聞」 翻譯: 「我曾經供養、服侍過, 數不清的佛、菩薩、阿羅漢。」 每一位過去佛出現, 地藏菩薩都在現場, 默默幫忙、學習、修行。 沒有突然冒出來的大菩薩 — 全都是一點一滴累積的。 ─────────── 🌸 第十句: 「及濟諸有情, 飢渴病死等」 翻譯: 「也救過數不清的眾生 — 餓的給食物, 渴的給水, 病的給醫, 死的給安慰。」 地藏菩薩做的事, 沒有「等級」 —— 你餓了, 他幫你弄飯; 你渴了, 他端水給你; 你病了, 他陪伴; 你害怕死亡, 他帶你看見光明。 最平凡的事, 都是他做的。 🌸 第十一句: 「本為他有情, 自舍多身命」 翻譯: 「為了別的眾生, 我已經捨棄了自己無數的身體、無數次的生命。」 地藏菩薩, 不是只「修一輩子」 — 是修了「無數輩子」。 每一輩子, 都把自己給出去。 ─────────── 🌸 第十二句: 「本為正法故, 舍多骨血皮」 翻譯: 「為了讓正法 (佛法) 傳下去, 我捨棄過自己的骨頭、血、皮膚。」 這不是比喻 — 過去無數生中, 地藏菩薩真的這樣做過。 為了一個眾生聽到一句佛法, 他願意把自己切開、給出去。 🌸 第十三句: 「棄捨自安樂, 悲愍諸有情」 翻譯: 「我放棄了自己的安樂, 全心慈悲憐憫眾生。」 地藏菩薩說完, 全場一片寂靜 —— 許多人, 默默掉下眼淚。 「原來, 在我們不知道的地方, 有人為我們承擔了這麼多......」 ─────────── 明天 — 大眾感動到不行, 紛紛把身上最好的東西, 拿出來供養地藏菩薩...... ─────────── 💡 啟發反思 聖嚴法師說: 「真正的願力, 不是嘴巴說的, 是身體做的。」 地藏菩薩沒有用華麗的句子, 但每一句, 都是他真實做過的事。 無數生命、無數骨血、無數安樂 — 都給了眾生。 今天 — 試著為一個人, 做一件「捨自己一點點」的事。 不用大, 一點點就好。一點點, 就是地藏菩薩的起點。 ─────────── 💡 明日預告 第 11 篇 — 「大眾供養地藏」: 聽完地藏菩薩的禮讚佛偈, 大眾感動萬分, 紛紛把身上最好的香花、寶飾、衣服, 都奉獻給地藏菩薩...... ─────────── 📚 免費索取《地藏菩薩本願經》紙本經書 《地藏菩薩本願經》是地藏法門的基礎, 淺而易懂, 適合初次接觸的朋友。 跟著我們一邊聽《十輪經》故事, 一邊在家讀本願經, 慢慢建立對地藏菩薩的認識。 私訊我們「我要索取地藏經」, 將免費寄送精美紙本經書給您(含郵資)🌸 #地藏十輪經 #地藏菩薩 #第10篇 #本願 #苦行 #地藏菩薩本願經 #每日佛經 #台灣佛教"
