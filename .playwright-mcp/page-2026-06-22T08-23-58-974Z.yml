                        - generic [ref=e647]: "🌸【地藏十輪經系列 · 第 15 篇 / 全 100 篇】 地藏菩薩的禪定 — 能讓大地平整、把魔王嚇得歸依、讓眾生不怕未來! 親愛的朋友, 早安 🙏 昨天 — 佛陀講了前 8 種地藏菩薩的禪定。 今天 — 繼續講中間 8 種, 每一種都更厲害, 連魔王都會被嚇到! ─────────── 📖 經文原文: 「隨住如是諸佛國土, 若入諸佛燈炬明定, 由此定力, 令彼佛土一切有情, 舍邪歸正歸依三寶。若入金剛光定, 由此定力, 令彼佛土所有一切小輪圍山、大輪圍山、蘇迷盧山及諸餘山, 溪澗、溝壑、瓦礫、毒刺、諸穢、草木, 皆悉不現......」 ✨ 「燈炬」(ㄉㄥ ㄐㄩˋ) = 燈和火把 ✨ 「金剛」= 最堅硬不可破壞的東西 ✨ 「電光」= 閃電的光 ✨ 「三寶」= 佛、法、僧三件最寶貴的事物 ─────────── 佛陀接著講第 9 種 —— 🌟 第 9 種: 「諸佛燈炬明定」 進入這個禪定 —— 那個世界的眾生, 會「捨邪歸正」, 開始相信並歸依三寶 (佛、法、僧)。 原本拜邪神的、相信迷信的、做壞事的人, 突然心裡一亮 —— 「啊! 原來真正的依靠是佛法!」 於是全部跑去歸依三寶。 ─────────── 🌟 第 10 種: 「金剛光定」 進入這個禪定 —— 那個世界發生神奇的變化: ⛰️ 所有的山 — 大山、小山 — 通通變平 🌊 所有的山溝、瓦礫、毒刺 — 通通消失 🌳 所有惡蟲毒獸、天災疫癘 — 通通沒了 整個世界 — 變得平整、清淨、莊嚴! 地藏菩薩, 用一個禪定, 就讓世界變成淨土。 🌟 第 11 種: 「智力難摧伏定」 進入這個禪定 —— 那個世界的「魔王」和魔王眷屬, 全部嚇壞了! 魔王本來想搗亂、誘惑眾生, 但被地藏菩薩的智慧力一震 —— 立刻歸依三寶, 不敢再搗亂。 ─────────── 🌟 第 12 種: 「電光明定」 進入這個禪定 —— 那個世界的眾生, 心裡的「對未來的恐懼」全部消失。 我們很多人怕什麼? — 怕老、怕病、怕死、怕沒錢、怕被拋棄...... 地藏菩薩這個禪定, 像閃電一樣劃過 — 恐懼消失, 心安下來。 🌟 第 13 種: 「具足上妙味定」 進入這個禪定 —— 那個世界的眾生, 想吃什麼, 立刻就有了。 飢餓的人, 隨念皆得飲食充足。 這不是「魔術」, 是「願力」 —— 地藏菩薩過去無數生, 不斷捨身為眾生, 累積這樣的福報。 ─────────── 🌟 第 14 種: 「具足勝精氣定」 進入這個禪定 —— 那個世界的眾生, 全部「身強體壯」, 病痛遠離。 想想看 —— 有錢但身體不好, 還是苦; 有勢但天天頭痛, 還是慘。 地藏菩薩給的這個禪定, 是「最根本的健康」。 🌟 第 15 種: 「上妙諸資具定」 進入這個禪定 —— 眾生想要的東西 — 床、衣服、寶飾、生活用品 — 全部「隨願而現」。 不是貪心地要, 是該有的、需要的, 一切都不缺。 那個世界, 變成「衣食無缺」的祥和世界。 ─────────── 🌟 第 16 種: 「無諍智定」 進入這個禪定 —— 那個世界的眾生, 身心勇健, 沒有冤親、沒有怨恨, 大家「和順歡娛、愛樂具足」。 沒有吵架、沒有打架、沒有戰爭。 夫妻和睦、父子親愛、朋友互助、同事合作。 想像一下這樣的世界 — 就是地藏菩薩用禪定創造的世界。 ─────────── 佛陀講完中間 8 種, 全場大眾感動不已: 「世尊! 地藏菩薩這樣的菩薩, 真是我們的依靠啊!」 佛陀微笑點頭:「還有 7 種, 明天繼續講。」 ─────────── 明天 — 佛陀會講最後 7 種三摩地, 包括「能引勝踴躍定」、「金剛勝定」...... ─────────── 💡 啟發反思 聖嚴法師說: 「世界要變平, 不是靠推土機, 是靠每個人的心先平。」 地藏菩薩的「金剛光定」, 能讓山變平、毒刺消失。 其實不是物理上的, 是心裡的 —— 當我們的心不再有「高低分別」、「敵我對立」, 世界就會變平。 今天 — 試著把心裡的一座小山推平: 那個你看不順眼的人、那件你還記恨的事 — 放下一點點。 心平了, 世界就平了一點點。 ─────────── 💡 明日預告 第 16 篇 — 「二十三種三摩地 · 下」: 佛陀講最後 7 種禪定 — 海電光定、世路光定、勝金剛定、增上觀勝幢定、慈悲聲定、引集諸福德定、海電光定...... ─────────── 📚 免費索取《地藏菩薩本願經》紙本經書 《地藏菩薩本願經》是地藏法門的基礎, 淺而易懂, 適合初次接觸的朋友。 跟著我們一邊聽《十輪經》故事, 一邊在家讀本願經, 慢慢建立對地藏菩薩的認識。 私訊我們「我要索取地藏經」, 將免費寄送精美紙本經書給您(含郵資)🌸 #地藏十輪經 #地藏菩薩 #第15篇 #二十三三摩地 #禪定中 #地藏菩薩本願經 #每日佛經 #台灣佛教"
