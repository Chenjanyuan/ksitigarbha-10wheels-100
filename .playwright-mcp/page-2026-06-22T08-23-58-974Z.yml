                        - generic [ref=e701]: "🌸【地藏十輪經系列 · 第 14 篇 / 全 100 篇】 地藏菩薩會 23 種特別的禪定! 每一種, 都能解決不同的人生問題...... 親愛的朋友, 早安 🙏 昨天 — 佛陀講地藏菩薩的「首楞伽摩」勝三摩地。 今天 — 佛陀要講地藏菩薩還會 23 種特別的禪定。我們先講前 8 種。 ─────────── 📖 經文原文: 「如是大士, 隨住如是諸佛國土, 隨所安住諸三摩地, 發起無量殊勝功德, 成熟無量所化有情。若入能發智定, 由此定力, 令彼佛土一切有情, 皆悉同見諸三摩地所行境界......」 ✨ 「三摩地」= 一種專心又穩定的禪定狀態 ✨ 「定力」= 禪定的力量 ✨ 「有情」= 一切有感受的生命 (人類、動物、天人...) ─────────── 佛陀說: 「這位大菩薩 — 每到一個佛國, 就會進入不同的禪定。 每一種禪定, 都會帶給那個世界的眾生不同的好處。」 全場聽得入迷 —— 「禪定還可以利益別人?」 佛陀點頭:「對, 真正的禪定, 不是自己關起來爽, 是把功德分給大家。」 ─────────── 🌟 第 1 種: 「能發智定」 地藏菩薩進入這個禪定 —— 那個世界所有眾生, 心裡突然「叮!」 看見了禪定的境界。 原本不懂禪定的人, 突然懂了。 原本不會打坐的人, 突然會坐了。 🌟 第 2 種: 「具足無邊智定」 進入這個禪定 —— 眾生會突然知道「該怎麼供養佛」。 以前不會合掌的人, 自然會了; 以前不會做善事的人, 自然開始了。 ─────────── 🌟 第 3 種: 「清淨智定」 進入這個禪定 —— 眾生會看清楚「貪欲的真相」。 原本想要的東西, 看清楚後, 突然不想要了。 就像一個人沉迷遊戲, 突然看見自己在沉迷, 就放下了。 那個「看清」的力量, 是這個禪定給的。 🌟 第 4 種: 「慚愧智定」 進入這個禪定 —— 眾生會升起「慚愧心」。 做錯事的人, 突然臉紅了; 對不起別人的人, 突然想道歉了。 「慚愧」不是丟臉, 是進步的開始。 地藏菩薩就是用這個禪定, 讓眾生主動改過。 ─────────── 🌟 第 5 種: 「諸乘明定」 進入這個禪定 —— 眾生會得到三種神通: 👁️ 天眼: 看得到很遠、很微小的東西 🧠 宿命通: 知道自己前世做過什麼 💀 死生智通: 看見眾生死後去哪裡 知道前世今生因果, 一個人就會很自然地行善避惡。 🌟 第 6 種: 「無憂神通明定」 進入這個禪定 —— 那個世界的眾生, 所有「憂愁、煩悶、昏沉」都消失了。 心裡突然像被洗過一樣清爽。 睡不好的人, 立刻能好好睡; 心情低落的人, 突然開朗起來。 ─────────── 🌟 第 7 種: 「具足勝通明定」 進入這個禪定 —— 眾生會得到「神通善巧」。 也就是 — 知道什麼時候該說什麼話、做什麼事, 永遠剛剛好。 很多人很善良, 但講話傷人; 很多人很努力, 但時機不對。 這個禪定, 給的就是「剛剛好」的智慧。 🌟 第 8 種: 「普照諸世間定」 進入這個禪定 —— 十方世界的黑暗, 全部被照亮。 那個世界的眾生, 可以看見十方所有佛國。 原本只能看見自己這個小村莊; 突然能看見整個宇宙的佛菩薩。 那個震撼, 會讓人發菩提心。 ─────────── 佛陀講完前 8 種, 看了看大眾 —— 「累了沒? 還沒喔? 那繼續講。」 全場心想:「世尊您不累, 我們怎麼會累!」 ─────────── 明天 — 佛陀會繼續講中間 8 種三摩地, 包括「金剛光定」、「電光明定」...... ─────────── 💡 啟發反思 聖嚴法師說: 「真正的功夫, 不是讓自己變好, 是讓別人變好。」 地藏菩薩的禪定, 不是自己關起來修 — 而是「我入定, 你受益」。 這才是大菩薩的禪定。 今天 — 不一定要打坐才叫禪定。 安靜地陪伴一個人 5 分鐘, 不滑手機、不說話, 就是禪定的開始。 那一刻, 他也會被你的安靜療癒。 ─────────── 💡 明日預告 第 15 篇 — 「二十三種三摩地 · 中」: 佛陀繼續講中間 8 種禪定 — 諸佛燈炬明定、金剛光定、電光明定......每一種都更厲害。 ─────────── 📚 免費索取《地藏菩薩本願經》紙本經書 《地藏菩薩本願經》是地藏法門的基礎, 淺而易懂, 適合初次接觸的朋友。 跟著我們一邊聽《十輪經》故事, 一邊在家讀本願經, 慢慢建立對地藏菩薩的認識。 私訊我們「我要索取地藏經」, 將免費寄送精美紙本經書給您(含郵資)🌸 #地藏十輪經 #地藏菩薩 #第14篇 #二十三三摩地 #禪定上 #地藏菩薩本願經 #每日佛經 #台灣佛教"
